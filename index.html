<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>習慣深潛</title>
<meta name="description" content="像素風的習慣養成遊戲：每天寫下最重要的事，完成就賺金幣、在商店開寶箱收集水下生物。資料只存在你自己的瀏覽器。">
<meta name="theme-color" content="#0b2546">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="習慣深潛">
<!-- 資料存在使用者自己的瀏覽器（localStorage）。只有選擇用 Google 登入的人，才會載入 Firebase 並同步到雲端（js/sync.js）。 -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bubbles" id="bubbles"></div>
<div class="wrap">
  <div class="brand"><span id="logo"></span><b>習慣深潛</b><em>HABIT DIVE</em><span class="sp"></span><div class="top-stat" id="stat"></div></div>
  <div id="banner"></div>
  <nav id="nav"></nav>
  <main id="main"></main>
  <footer class="foot">習慣深潛・made by <a href="https://vocus.cc/salon/frog-journey" target="_blank" rel="noopener">Frog Journey</a></footer>
</div>
<div class="ov hidden" id="ov"><div class="px modal" id="modal"></div></div>
<div class="ov hidden" id="sheetov"><div class="px modal sheet" id="sheet"></div></div>
<div class="ov hidden" id="askov" style="z-index:15"><div class="px modal"><div class="msg" id="askmsg"></div>
  <input id="askin" class="hidden" style="width:100%;margin-bottom:10px">
  <button data-act="askno" id="askno">取消</button><button class="pri" data-act="askyes" id="askyes">確定</button></div></div>
<div class="toast hidden" id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" class="hidden">

<!-- 一般 script（不是 module），依順序載入、共用全域變數；直接雙擊 index.html 也能在本機打開 -->
<script src="js/config.js"></script>
<script src="js/creatures.js"></script>
<script src="js/core.js"></script>
<script src="js/game.js"></script>
<script src="js/views.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/sync.js"></script>
<script src="js/main.js"></script>
</body>
</html>
