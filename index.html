<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>習慣深潛</title>
<meta name="description" content="像素風的習慣養成遊戲：每天寫下最重要的事，完成就開寶箱、收集水下生物。資料只存在你自己的瀏覽器。">
<meta name="theme-color" content="#0b2546">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="習慣深潛">
<!-- 不載入任何外部資源；所有資料只存在使用者自己的瀏覽器（localStorage），不會上傳。 -->
<style>
:root{
  --bg:#06152b; --panel:#0d2442; --panel2:#12305a; --edge:#1f4673; --edge-hi:#2f6299;
  --ink:#eaf2ff; --dim:#8aa9cc; --faint:#5b7ca3; --line:rgba(138,169,204,.16);
  --coin:#ffcd75; --coin-d:#c59a3c; --xp:#73eff7; --ok:#5fd38d; --warn:#f2945f;
  --r0:#94b0c2; --r1:#38b764; --r2:#41a6f6; --r3:#b267e6; --r4:#ffcd75;
}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);background:var(--bg);min-height:100vh;
  font:17px/1.65 "Cascadia Mono",Consolas,"Microsoft JhengHei UI","Microsoft JhengHei",monospace}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,
  #174673 0 12%,#133c66 12% 28%,#0f3157 28% 46%,#0b2646 46% 66%,#081b36 66% 84%,#06152b 84%)}
.bubbles i{position:fixed;bottom:-12px;width:6px;height:6px;background:rgba(115,239,247,.22);z-index:-1;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh)}}
@media (prefers-reduced-motion:reduce){.bubbles{display:none}}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
a{color:var(--xp)}
.px{background:var(--panel);margin:0 3px 20px;padding:16px 18px;
  box-shadow:0 -3px 0 var(--edge),0 3px 0 var(--edge),-3px 0 0 var(--edge),3px 0 0 var(--edge)}
/* 區塊標題：中文標題＋小小的英文標籤 */
.sh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.sh b{font-size:18px;letter-spacing:.04em}
.sh em{font-style:normal;font-size:11px;letter-spacing:.24em;color:var(--faint)}
.sub{margin:18px 0 6px;font-size:15px;color:var(--dim);letter-spacing:.04em}
button{font:inherit;font-size:15px;color:var(--ink);background:transparent;border:0;padding:5px 12px;margin:4px 3px;cursor:pointer;
  box-shadow:0 -2px 0 var(--edge-hi),0 2px 0 var(--edge-hi),-2px 0 0 var(--edge-hi),2px 0 0 var(--edge-hi)}
button:hover{background:rgba(115,239,247,.08)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.35;cursor:not-allowed;transform:none}
button.pri{background:var(--coin);color:#1a1c2c;font-weight:bold;
  box-shadow:0 -2px 0 #fff0c0,0 2px 0 var(--coin-d),-2px 0 0 var(--coin-d),2px 0 0 var(--coin-d)}
button.pri:hover{background:#ffd98f}
button.sel{color:var(--xp);background:rgba(115,239,247,.08);
  box-shadow:0 -2px 0 var(--xp),0 2px 0 var(--xp),-2px 0 0 var(--xp),2px 0 0 var(--xp)}
button.ghost{box-shadow:none;color:var(--dim);padding:3px 6px}
button.ghost:hover{color:var(--ink);background:none}
small,.dim{color:var(--dim)}
b{color:#fff}
.hidden{display:none!important}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
input,select{font:inherit;font-size:16px;color:var(--ink);background:#071a33;border:0;padding:5px 8px;box-shadow:inset 0 0 0 2px var(--edge);color-scheme:dark}
input:focus,select:focus{outline:none;box-shadow:inset 0 0 0 2px var(--xp)}
input::placeholder{color:var(--faint)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);box-shadow:none;cursor:pointer;flex:none}
/* 像素金幣 */
.cn{display:inline-block;width:12px;height:12px;margin-left:4px;vertical-align:-1px;background:var(--coin);
  box-shadow:inset -2px -2px 0 var(--coin-d),inset 2px 2px 0 #fff0c0}

/* HUD */
.hud{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.depth{font-size:34px;line-height:1;color:var(--xp);font-weight:bold}
.depth span{font-size:16px;margin-right:3px}
.rank{color:var(--dim);font-size:14px;margin-top:4px}
.hud-m{flex:1;min-width:180px}
.hud-m small{font-size:14px}
.bar{height:10px;background:#071a33;box-shadow:inset 0 0 0 2px var(--edge);margin:4px 0}
.bar i{display:block;height:100%;background:var(--xp)}
.bar.c i{background:var(--coin)}
.coin{color:var(--coin);font-size:20px;font-weight:bold}
.hud-r{text-align:right}
.hud .label{font-size:13px;letter-spacing:.12em;color:var(--dim);margin-bottom:2px}
.coin.big{font-size:26px;line-height:1.1}
.coin.big .cn{width:16px;height:16px;margin-left:6px;vertical-align:0;box-shadow:inset -3px -3px 0 var(--coin-d),inset 3px 3px 0 #fff0c0}
/* 像素開關 */
.switch{display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-size:14px;color:var(--dim);cursor:pointer}
.toggle{width:44px;height:22px;padding:0;margin:0;position:relative;background:#071a33;
  box-shadow:0 -2px 0 var(--edge-hi),0 2px 0 var(--edge-hi),-2px 0 0 var(--edge-hi),2px 0 0 var(--edge-hi)}
.toggle i{position:absolute;top:4px;left:4px;width:14px;height:14px;background:var(--faint);transition:left .12s steps(3)}
.toggle.on{background:#1e5a3a;box-shadow:0 -2px 0 var(--ok),0 2px 0 var(--ok),-2px 0 0 var(--ok),2px 0 0 var(--ok)}
.toggle.on i{left:26px;background:var(--ok)}
.toggle:hover{background:#0b2546}.toggle.on:hover{background:#246b45}
nav{display:flex;flex-wrap:wrap;margin:0 3px 20px;box-shadow:inset 0 -2px 0 var(--edge)}
nav button{box-shadow:none;margin:0;padding:8px 14px;color:var(--dim);font-size:16px}
nav button small{font-size:13px;color:var(--faint);margin-left:4px}
nav button.sel{color:var(--ink);background:none;box-shadow:inset 0 -3px 0 var(--coin)}
.banner{background:#4a2414;margin:0 3px 20px;padding:10px 14px;box-shadow:0 0 0 2px var(--warn)}
.foot{text-align:center;color:var(--faint);font-size:13px;margin-top:8px;letter-spacing:.04em}
.foot a{color:var(--dim);text-decoration:none}
.foot a:hover{color:var(--ink)}

/* 今日 */
.habits{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hab{background:var(--panel2);padding:10px 12px;font-size:15px;box-shadow:inset 3px 0 0 var(--edge-hi)}
.hab.on{box-shadow:inset 3px 0 0 var(--ok)}
.hab .hn{font-weight:bold;color:#fff;font-size:16px}
.hab .meter{height:4px;background:#071a33;margin-top:8px}
.hab .meter i{display:block;height:100%;background:var(--ok)}
.streak{color:var(--warn);font-weight:bold}
.streak small{color:var(--warn);font-weight:normal;margin-left:2px}
.warn{color:var(--warn);font-size:15px;margin-top:10px}
.done-tag{color:var(--ok)}
.mini{font-size:14px;color:var(--dim);margin-top:4px}
.goal{background:var(--panel2);padding:12px 14px;margin:14px 0}
.label{font-size:12px;letter-spacing:.2em;color:var(--faint)}
.need{text-align:right;font-size:15px;white-space:nowrap}
.erow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.erow input.sp{flex:1 1 100px;min-width:0}
.prow{display:flex;align-items:center;gap:10px;padding:6px 0;flex-wrap:wrap}
.prow .ptext{flex:1 1 220px;min-width:0}
.prow.done .ptext{text-decoration:line-through;color:var(--dim)}
.prow .no{width:16px;text-align:center;color:var(--faint);font-size:15px}
.divider{margin:12px 0 4px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;letter-spacing:.2em;color:var(--faint)}
.seg-switch button{margin:0 0 0 -2px;padding:4px 12px;font-size:14px}
.timer{text-align:center;box-shadow:0 -3px 0 var(--coin),0 3px 0 var(--coin),-3px 0 0 var(--coin),3px 0 0 var(--coin)}
.clock{font-size:64px;line-height:1.1;color:var(--coin);letter-spacing:4px;font-weight:bold}
.segs{margin:10px 0;font-size:14px;color:var(--dim)}
.segs span{margin:0 4px}
.segs .past{opacity:.4}
.segs .now{color:var(--coin);font-weight:bold}
.link{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.link:last-child{border-bottom:0}
.link:hover b{color:var(--xp)}
.link .sp{min-width:0}
.exrow{margin:0 0 8px 58px;font-size:15px}
.exrow input{width:76px}
.exrow .note{flex:1;min-width:140px;width:auto}
@media (max-width:520px){.exrow{margin-left:0}}

/* 寶箱 */
.ov{position:fixed;inset:0;background:rgba(2,8,20,.82);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal{width:min(380px,100%);text-align:center}
.modal h2{margin:4px 0 10px;font-size:19px}
.msg{white-space:pre-line;margin:6px 0 14px}
.sprite{image-rendering:pixelated;image-rendering:crisp-edges;display:block;margin:10px auto}
.shake{animation:shake .22s steps(2) infinite}
@keyframes shake{0%{transform:translateX(-4px) rotate(-4deg)}100%{transform:translateX(4px) rotate(4deg)}}
.pop{animation:pop .4s steps(5)}
@keyframes pop{from{transform:scale(.2)}to{transform:scale(1)}}
.rar{display:inline-block;padding:1px 8px;color:#1a1c2c;font-size:14px;letter-spacing:.1em}
.glow3{filter:drop-shadow(0 0 10px var(--r3))}
.glow4{filter:drop-shadow(0 0 14px var(--r4));animation:pop .4s steps(5),gold 1s steps(2) infinite .4s}
@keyframes gold{50%{filter:drop-shadow(0 0 24px #fff3b0)}}
.new{color:var(--coin);font-size:15px;letter-spacing:.1em}
.gain{margin:12px 0;font-size:17px}

/* 圖鑑 */
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.dex .cell{background:var(--panel2);padding:10px 4px 8px;text-align:center;cursor:pointer;box-shadow:inset 0 -3px 0 var(--rc)}
.dex .cell.no{background:#0a1d36;cursor:default;box-shadow:none}
.dex .nm{font-size:15px}
.grp{margin:18px 0 10px}

/* 商店 */
.shop .it{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.shop .it:last-child{border-bottom:0}
.shop .ic{font-size:22px;width:32px;text-align:center}
.shop .it .sp{flex:1 1 120px;min-width:0}
.price{color:var(--coin);text-align:right;white-space:nowrap}
.mini .bar{height:8px;display:inline-block;width:120px;vertical-align:middle;margin:0 6px}

/* 紀錄 */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;background:#0f2a4d}
.heat i.l1{background:#1f5a8a}.heat i.l2{background:#2f8fc0}.heat i.l3{background:#73eff7}.heat i.l4{background:#e8ffff}
.heat i.today{outline:2px solid var(--coin)}
.legend{display:flex;align-items:center;gap:4px;margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px}
.stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat div{background:var(--panel2);padding:10px 12px}
.stat b{font-size:22px;display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);padding:10px 18px;z-index:20;
  box-shadow:0 0 0 2px var(--xp);max-width:90vw}
</style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>
<div class="wrap">
  <header class="px hud" id="hud"></header>
  <div id="banner"></div>
  <nav id="nav"></nav>
  <main id="main"></main>
  <footer class="foot">習慣深潛・made by <a href="https://vocus.cc/salon/frog-journey" target="_blank" rel="noopener">Frog Journey</a></footer>
</div>
<div class="ov hidden" id="ov"><div class="px modal" id="modal"></div></div>
<div class="ov hidden" id="askov" style="z-index:15"><div class="px modal"><div class="msg" id="askmsg"></div>
  <input id="askin" class="hidden" style="width:100%;margin-bottom:10px">
  <button data-act="askno" id="askno">取消</button><button class="pri" data-act="askyes" id="askyes">確定</button></div></div>
<div class="toast hidden" id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" class="hidden">

<script>
/* ========= 可自行調整的設定 ========= */
const CONFIG = {
  pomodoroMin: 25,            // 一段專注的長度；使用者選的是「整段工作階段」的總長度（5–120 分）
  pomoRewardMin: 20,          // 專注滿這麼多分鐘才開寶箱，避免設 1 分鐘來刷
  breakMin: 5, longBreakMin: 15, longBreakEvery: 4,   // 工作階段中：每段專注後短休息，每 4 段長休息
  dayStartHour: 4,            // 凌晨 4 點前都算「前一天」，熬夜做的也算數
  habitDays: 66,              // Lally et al. 2010：習慣自動化所需天數中位數
  maxCustom: 5,               // 自訂習慣最多幾個（不含內建的六件事、Vocus、運動）
  xp:    { check: 10, exercise: 20, plan: 10, pomo: 10, pubchest: 30, period: 30, top3: 15 },
  coins: { base: 5, rand: 6, critChance: 0.1, period: 40, welcome: 20, top3: 20, pubchest: 25 },
  rewardRows: 3,
  coinsPerDay: 60,            // 紀錄不夠時，商店用這個速度估計「要努力幾天」              // 六件事只有前幾項打勾／番茄鐘會開寶箱，其餘只做紀錄
  rarityRates: [55, 28, 12, 4.5, 0.5],   // 普通 / 少見 / 稀有 / 史詩 / 傳說（%）
  dupCoins: [2, 5, 15, 40, 100],         // 抽到重複生物時換成的金幣
  shop: [
    { id: 'tea',     icon: '🧋', name: '喝一杯手搖飲',       price: 300 },
    { id: 'episode', icon: '📺', name: '追一集劇',           price: 300 },
    { id: 'sweet',   icon: '🍰', name: '吃一份甜點',         price: 500 },
    { id: 'meal',    icon: '🍜', name: '吃一頓喜歡的餐廳',   price: 1200 },
    { id: 'buy',     icon: '🛍', name: '買一樣想要很久的東西', price: 3500 },
  ],
  // 六件事裡不算連勝的一般分類（預設值；使用者可在「✎ 編輯習慣」自訂，存在 S.gcats）
  generalCats: [
    { id: 'other',   e: '📌', n: '其他',     ph: '其他重要的事' },
  ],
};

// 內建習慣（不能刪）。weeks: 0 = 每天；1、2 = 每 1／2 週至少 target 次
// kind: plan = 寫好六件事、vocus = 勾「發布了文章」才算、exercise = 可記距離時間、custom = 自訂
const DEFAULT_HABITS = [
  { id: 'plan',     e: '📝', n: '六件事', kind: 'plan',     weeks: 0, target: 1 },
  { id: 'vocus',    e: '✍️', n: 'Vocus',  kind: 'vocus',    weeks: 1, target: 1 },
  { id: 'exercise', e: '🏃', n: '運動',   kind: 'exercise', weeks: 1, target: 3 },
];
const PH = { vocus: 'Vocus：今天寫哪一段？', exercise: '運動：跑步、游泳…' };
const ETAGS = ['跑步', '游泳', '重訓', '潛水', '登山', '其他'];
const RARITY = [
  { name: '普通', color: 'var(--r0)' }, { name: '少見', color: 'var(--r1)' }, { name: '稀有', color: 'var(--r2)' },
  { name: '史詩', color: 'var(--r3)' }, { name: '傳說', color: 'var(--r4)' },
];
// 等級稱號照潛水證照的進階路線：[從幾級開始, 稱號]
const RANKS = [
  [1, '浮潛客'], [3, '體驗潛水員'], [5, '開放水域潛水員'], [8, '進階潛水員'], [12, '救援潛水員'],
  [16, '潛水長'], [20, '潛水教練'], [25, '技術潛水員'], [30, '深海探險家'], [40, '海洋傳說'],
];

/* ========= 像素圖 ========= */
const PAL = { k:'#1a1c2c', w:'#f4f4f4', o:'#ef7d57', y:'#ffcd75', b:'#41a6f6', n:'#3b5dc9', c:'#73eff7',
  g:'#38b764', G:'#257179', P:'#b267e6', r:'#e43b44', s:'#94b0c2', S:'#566c86', t:'#a0703c' };
const FISH = [
  '.....kkkk....',
  '...kkAAAAkk..',
  'kk.kAAAAAAAk.',
  'kAkAAAAAAAkAk',
  'kAAAAAAAAAAAk',
  'kAkAAAAAAAAk.',
  'kk.kAAAAAAk..',
  '...kkAAAAk...',
  '.....kkkk....',
];
function fish(body, stripes = {}, top) {
  const rows = FISH.map(r => [...r].map((ch, i) => ch === 'A' ? (stripes[i] || body) : ch).join(''));
  return top ? [top, ...rows] : rows;
}
const CHEST = ['.kkkkkkkkkk.','kttttttttttk','kttttttttttk','kyyyyyyyyyyk','ktttkyyktttk',
  'ktttkyyktttk','kttttkkttttk','kttttttttttk','kyyyyyyyyyyk','.kkkkkkkkkk.'];

const CREATURES = [
  { id:'clown', name:'小丑魚', r:0, fact:'住在海葵裡，出生時全是雄性。', px: fish('o', {4:'w', 8:'w'}) },
  { id:'damsel', name:'藍魔鬼雀鯛', r:0, fact:'珊瑚礁上最常見的亮藍色小魚。', px: fish('b', {1:'c', 2:'c'}) },
  { id:'butterfly', name:'蝴蝶魚', r:0, fact:'多半成對生活，在礁石間一起覓食。', px: fish('y', {9:'k', 1:'w'}) },
  { id:'star', name:'海星', r:0, fact:'沒有腦，斷掉的腕還能再長回來。', px: ['.....k.....','....kok....','....kok....','kkkkoookkkk','kooooyooook','.kkoooookk.','...kooook..','..kok.kok..','.kok...kok.','.kk.....kk.'] },
  { id:'hermit', name:'寄居蟹', r:0, fact:'長大就要換更大的殼——跟習慣一樣。', px: ['....kkkkk...','...ktttttk..','..kttkkkttk.','..ktkttktk..','..kttkkttk..','.kkkttttk...','krrrkkkk....','krkrrk......','.k.k.k......'] },
  { id:'urchin', name:'海膽', r:0, fact:'下水時最該注意別踩到的傢伙。', px: ['k....k....k','.k...k...k.','..k.kPk.k..','...kPPPk...','kkkPPPPPkkk','...kPPPk...','..k.kPk.k..','.k...k...k.','k....k....k'] },
  { id:'turtle', name:'綠蠵龜', r:1, fact:'休息時可以閉氣好幾個小時。', px: ['.....kkkkk....','...kkGgGgGkk..','..kGgGgGgGgkkk','.kGgGgGgGgGkgk','.kyyyyyyyyykgk','..kkgkkkkgkkk.','..kgk....kgk..','...k......k...'] },
  { id:'octopus', name:'章魚', r:1, fact:'三顆心臟、藍色的血。', px: ['...kkkkk...','..krrrrrk..','.krrrrrrrk.','.krwkrwkrk.','.krrrrrrrk.','..krrrrrk..','.krkrkrkrk.','kr.kr.kr.rk','k..k..k...k'] },
  { id:'nudi', name:'海蛞蝓', r:1, fact:'微距攝影的最愛，配色一隻比一隻浮誇。', px: ['..o.o...o.o.o','.kPPPkkkkPPPk','kPPwPPPPPPPPk','kPPPPPwPPPPPk','.kyyyyyyyyyk.','..kkkkkkkkk..'] },
  { id:'lion', name:'獅子魚', r:1, fact:'很美，但背鰭有毒，看就好。', px: fish('r', {3:'w', 5:'w', 7:'w', 9:'w'}, '...r.r.r.r...') },

const spriteCache = {};

const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dayKey = (ts = Date.now()) => keyOf(new Date(ts - CONFIG.dayStartHour * 3600e3));
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const weekKey = k => { const d = parseKey(k); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return keyOf(d); };

function periodKey(d, weeks) {
  const w = weekKey(d);
  if (weeks <= 1) return w;
  const days = Math.round((parseKey(w) - parseKey(EPOCH)) / 864e5);
  return addDays(EPOCH, Math.floor(days / (7 * weeks)) * 7 * weeks);
}

// XP、金幣、圖鑑由 logs 算；每天完成了哪些習慣由六件事的打勾算（加上舊版紀錄）
function derive() {
  const D = { xp: 0, coins: 0, col: {}, days: {}, per: {}, articles: 0, claimed: new Set() };
  const inc = (d, k) => { const x = D.days[d] || (D.days[d] = {}); x[k] = (x[k] || 0) + 1; };
  for (const l of S.logs) {
    D.xp += l.xp || 0; D.coins += l.c || 0;
    if (l.drop) D.col[l.drop] = (D.col[l.drop] || 0) + 1;
    if (l.key) D.claimed.add(l.key);
    if (['wake', 'plan', 'research', 'exercise'].includes(l.k) && !l.late) inc(l.d, l.k);
    if (l.k === 'article') inc(l.d, 'vocus');
  }
  for (const [d, P] of Object.entries(S.plans)) for (const it of P) {
    if (!it.done) continue;
    if (it.cat === 'vocus') { if (it.pub && it.pub.on) inc(d, 'vocus'); }
    else if (habit(it.cat)) inc(d, it.cat);
  }
  for (const x of Object.values(D.days)) D.articles += x.vocus || 0;
  // 週期型習慣：Vocus 算篇數，其他算「有做的天數」
  for (const h of activeHabits()) if (h.weeks) for (const [d, x] of Object.entries(D.days)) if (x[h.id]) {
    const k = h.id + '@' + periodKey(d, h.weeks);
    D.per[k] = (D.per[k] || 0) + (h.kind === 'vocus' ? x[h.id] : 1);
  }
  return D;
}
const dayDone = (D, d, k) => !!(D.days[d] && D.days[d][k]);
const perCount = (D, h, p) => D.per[h.id + '@' + p] || 0;

// 每天的習慣「不連續漏兩次」：漏一次不斷，連續漏兩次才歸零；進行中的今天不算漏。
// 週期型習慣漏一期就斷：週期本身已經是自己選的寬鬆度
function chain(isDone, cur, step, first, maxMiss) {
  let n = isDone(cur) ? 1 : 0, miss = 0, k = step(cur);
  const prevMissed = !isDone(k);
  while (k >= first) {
    if (isDone(k)) { n++; miss = 0; } else if (++miss >= maxMiss) break;
    k = step(k);
  }
  return { n, risk: maxMiss > 1 && n > 0 && !isDone(cur) && prevMissed };
}
function streaks(D) {
  const today = dayKey(), first = Object.keys(D.days).sort()[0] || today, out = {};
  for (const h of activeHabits()) out[h.id] = h.weeks
    ? chain(p => periodDone(D, h, p), periodKey(today, h.weeks), p => addDays(p, -7 * h.weeks), periodKey(first, h.weeks), 1)

}

// 條件恢復時原封不動還回來（不重抽，避免用勾掉再勾回刷稀有生物）
function reconcile(allowGrant) {
  const d = dayKey(), P = S.plans[d] || [];
  S.held = S.held || {};
  const conds = [
    ['top3:' + d, 'top3', P.length > 0 && allDone(P.slice(0, CONFIG.rewardRows))],
    ['art:' + d, 'pubchest', !!habit('vocus') && P.some(x => x.done && x.cat === 'vocus' && x.pub && x.pub.on)],
  ];
  for (const h of activeHabits()) if (h.weeks && h.kind !== 'vocus') {
    const p = periodKey(d, h.weeks);
    conds.push([h.id === 'exercise' && h.weeks === 1 ? 'week:' + p : `per:${h.id}:${p}`, 'period',
      periodDone(derive(), h, p), `${h.e} ${h.n} ${periodWord(h)}達標！額外寶箱`]);
  }
  for (const [key, kind, ok, title] of conds) {
    const has = derive().claimed.has(key);
    if (ok && !has) {
      if (S.held[key]) { S.logs.push(S.held[key]); delete S.held[key]; }
      else if (allowGrant) grant(kind, null, { key, title });
    } else if (!ok && has) {
      const i = S.logs.findIndex(l => l.key === key);
      if (i >= 0) S.held[key] = S.logs.splice(i, 1)[0];

// 番茄鐘是一段「專注工作階段」：選整段總長度，自動切成「專注 25 分＋休息」的段落。

function sessionPlan(total) {
  const segs = [];
  let rem = total, focusN = 0;
  while (rem > 0) {
    const f = Math.min(CONFIG.pomodoroMin, rem);
    segs.push({ m: 'focus', min: f }); rem -= f; focusN++;
    if (rem <= 0) break;
    const b = focusN % CONFIG.longBreakEvery === 0 ? CONFIG.longBreakMin : CONFIG.breakMin;
    if (rem <= b + 5) { segs[segs.length - 1].min += rem; break; }   // 只剩一點點就併進這段專注，不以休息收尾
    segs.push({ m: 'break', min: b }); rem -= b;
  }

}

// 一段結束：結算專注、自動進入下一段
function finishSeg() {
  const T = S.timer, seg = T.segs[T.si], end = T.start + seg.min * 60e3, last = T.si === T.segs.length - 1;
  if (last) S.timer = null; else { T.si++; T.start = end; }
  const next = S.timer && S.timer.segs[S.timer.si];
  SFX.done();
  if (seg.m === 'focus') {
    const d = dayKey(end - 1);
    if (seg.min >= CONFIG.pomoRewardMin) reward(() => grant('pomo', null, { title: `專注 ${seg.min} 分鐘完成！`, d, extra: { min: seg.min } }));
    else { S.logs.push({ id: rid(), t: end, d, k: 'pomo', min: seg.min, xp: 0, c: 0 }); save(); render(); }
  } else { save(); render(); }
  toast(last ? '這段專注全部完成！' : next.m === 'break' ? `休息 ${next.min} 分鐘，起來走走吧` : `休息結束，繼續專注 ${next.min} 分鐘`);
}
function tick() {
  if (!S.timer) { document.title = '習慣深潛'; return; }
  let T = S.timer;
  if (!T.segs) {   // 舊版單段計時器
    S.timer = T = { segs: [{ m: T.mode === 'break' ? 'break' : 'focus', min: Math.round(T.dur / 60e3) }], si: 0, start: T.start };
  }
  // 關掉頁面再回來時可能已經跑完好幾段，一段一段結算
  if (Date.now() >= T.start + T.segs[T.si].min * 60e3) {
    while (S.timer && Date.now() >= S.timer.start + S.timer.segs[S.timer.si].min * 60e3) finishSeg();
    return;
  }
  const seg = T.segs[T.si], dur = seg.min * 60e3, left = T.start + dur - Date.now();
  const txt = `${pad(Math.floor(left / 60000))}:${pad(Math.floor(left / 1000) % 60)}`;
  document.title = `${seg.m === 'break' ? '☕' : '⏳'} ${txt} 習慣深潛`;
  const el = document.getElementById('tclock'); if (el) el.textContent = txt;
  const bar = document.getElementById('tbar'); if (bar) bar.style.width = (100 - left / dur * 100) + '%';
}

// 跑步算每公里配速，游泳算每 100 公尺
function paceText(e) {
  if (!(e.dist > 0) || !(e.min > 0)) return '';
  const swim = e.type === '游泳', sec = Math.round(e.min * 60 / (swim ? e.dist * 10 : e.dist));
  return `配速 ${Math.floor(sec / 60)}'${pad(sec % 60)}"${swim ? '/100m' : '/km'}`;
}
function allExercise() {
  const out = [];
  for (const [d, P] of Object.entries(S.plans)) for (const it of P)
    if (it.done && it.cat === 'exercise') out.push({ d, text: it.text, ...(it.ex || {}) });
  for (const l of S.logs) if (l.k === 'exercise') out.push({ d: l.d, type: l.tag, dist: l.dist, min: l.min, note: l.note });
  return out;
}
// input=true 時多一個輸入框，按確定回傳輸入的文字，按取消回傳 false
function ask(msg, yes = '確定', no = '取消', input = false) {
  const inp = document.getElementById('askin');
  document.getElementById('askmsg').textContent = msg;
  document.getElementById('askyes').textContent = yes;
  document.getElementById('askno').textContent = no;
  inp.classList.toggle('hidden', !input); inp.value = '';
  document.getElementById('askov').classList.remove('hidden');
  if (input) inp.focus();
  return new Promise(res => { ask.res = v => { document.getElementById('askov').classList.add('hidden'); res(v && input ? inp.value.trim() : v); }; });
}

      <button class="ghost" data-act="shopdel" data-v="${i}" title="刪除">✕</button></div>`).join('')}
    <div class="row" style="margin-top:8px"><button data-act="shopadd">＋ 新增獎勵</button></div></section>`;
  // 用最近 14 天的平均收入估計「還要努力幾天」；有收入的日子不到 5 天時用 CONFIG.coinsPerDay
  const since = addDays(dayKey(), -13), recent = S.logs.filter(l => l.d >= since && l.c > 0 && l.k !== 'welcome');
  const activeDays = new Set(recent.map(l => l.d)).size;
  const rate = activeDays >= 5 ? Math.max(10, Math.round(recent.reduce((a, l) => a + l.c, 0) / 14)) : CONFIG.coinsPerDay;
  const daysFor = p => Math.max(1, Math.ceil(p / rate));
  const items = [...shopItems()].sort((a, b) => a.price - b.price), next = items.find(it => it.price > D.coins);
  return `<section class="px shop">${sh('獎勵商店', 'REWARDS', '<button class="ghost" data-act="shopedit">編輯</button>')}
    <div class="mini">你可以自行設定想要的獎勵。${activeDays >= 5 ? `最近 14 天平均每天賺 ${rate} 金幣。` : `目前以每天約 ${rate} 金幣估算。`}</div>
    ${next ? `<div class="goal"><div class="label">NEXT GOAL</div>
      <div class="row"><span>${esc(next.icon)} ${esc(next.name)}</span><span class="sp"></span><span class="coin" style="font-size:16px">${D.coins} / ${next.price}${COIN}</span></div>
      <div class="bar c"><i style="width:${Math.max(0, D.coins / next.price * 100)}%"></i></div>
      <div class="mini">大約還要 ${daysFor(next.price - D.coins)} 天</div></div>` : ''}
    ${items.length ? '' : '<div class="dim" style="margin-top:8px">還沒有獎勵，按「編輯」新增。</div>'}
    ${items.map(it => `<div class="it"><span class="ic">${esc(it.icon)}</span><span class="sp">${esc(it.name)}</span>
      <span class="price">${it.price}${COIN}</span>
      ${D.coins >= it.price ? `<button class="pri" data-act="redeem" data-v="${it.id}">兌換</button>`
        : `<span class="dim need">約 ${daysFor(it.price - D.coins)} 天</span>`}</div>`).join('')}
  </section>
  <section class="px">${sh('兌換紀錄', 'HISTORY')}${hist.length ? hist.map(l => `<div class="row"><span class="dim">${l.d}</span><span>${esc(l.name)}</span><span class="sp"></span><span class="price">${l.c}${COIN}</span></div>`).join('') : '<div class="dim">還沒有兌換過。</div>'}</section>`;
}

function log(D) {
  const td = dayKey(), start = addDays(weekKey(td), -7 * 17), H = activeHabits();
  let cells = '';
  for (let k = start; k <= td; k = addDays(k, 1)) {
    const x = D.days[k] || {}, done = H.filter(h => x[h.id]), n = done.length;
    const lv = n === 0 ? 0 : n >= H.length ? 4 : Math.min(3, Math.ceil(n / H.length * 3));
    cells += `<i class="l${lv}${k === td ? ' today' : ''}" title="${k}　${esc(done.map(h => h.e + ' ' + h.n).join(' ')) || '—'}"></i>`;
  }
  const daysOf = k => Object.values(D.days).filter(x => x[k]).length;
  const runs = allExercise().filter(e => e.type === '跑步' && e.dist > 0), runKm = runs.reduce((a, e) => a + +e.dist, 0);
  const pomos = S.logs.filter(l => l.k === 'pomo');
  const pomoHours = pomos.reduce((a, l) => a + (l.min || CONFIG.pomodoroMin), 0) / 60;
  return `<section class="px">${sh('最近 18 週', 'ACTIVITY')}
    <div class="heat">${cells}</div>
    <small class="legend">少 <i style="background:#0f2a4d"></i><i style="background:#1f5a8a"></i><i style="background:#2f8fc0"></i><i style="background:#73eff7"></i><i style="background:#e8ffff"></i> 多</small></section>
  <section class="px">${sh('累積', 'TOTALS')}<div class="stat">
    ${H.map(h => h.kind === 'vocus' ? `<div><small>${esc(h.e)} ${esc(h.n)}</small><b>${D.articles}</b><small>篇文章</small></div>`
      : `<div><small>${esc(h.e)} ${esc(h.n)}</small><b>${daysOf(h.id)}</b><small>天</small></div>`).join('')}
    <div><small>番茄鐘</small><b>${pomos.length}</b><small>段・${pomoHours.toFixed(1)} 小時</small></div>
    <div><small>跑步總距離</small><b>${runKm.toFixed(1)}</b><small>km・${runs.length} 次</small></div>
  </div></section>
  <section class="px">${sh('存檔', 'BACKUP')}
    <div class="mini">紀錄只存在這個瀏覽器，不會上傳。換裝置或清除瀏覽資料就會消失，請定期下載備份。</div>
    ${FS.ok ? `<div class="mini">✓ 同步寫入檔案「${esc(FS.handle.name)}」${FS.last ? '，最後寫入 ' + FS.last : ''}</div>` : ''}
    <div class="row" style="margin-top:8px">${'showSaveFilePicker' in window ? `<button data-act="linknew">建立存檔檔案</button><button data-act="linkopen">開啟既有存檔</button>` : ''}
      <button data-act="export">下載備份</button><button data-act="import">從備份還原</button></div></section>`;
}

// 關於頁：作者的 Vocus 沙龍與潛水文章
const ABOUT_LINKS = [
  { title: 'Frog Journey｜兩棲類的冒險生活', sub: 'Vocus 沙龍：登山、潛水、旅居的第一手紀錄', url: 'https://vocus.cc/salon/frog-journey' },
  { title: '潛水日誌 #1｜印尼・Nusa Penida・Manta Point：5 隻鬼蝠魟從頭頂飛過', sub: '圖鑑裡的鬼蝠魟，就是從這裡來的', url: 'https://vocus.cc/article/6a8ec287fd897800012e765a' },
  { title: '潛水日誌 #2｜印尼・Nusa Penida・Crystal Bay：沒看到翻車魚！', sub: '想抽到翻車魚？先看看我在海裡等了多久', url: 'https://vocus.cc/article/6ad986a9fd89780001033212' },
  { title: 'OW 潛水考照心得｜課程都在學什麼？我的完整考照紀錄', sub: '從零開始學潛水的紀錄', url: 'https://vocus.cc/article/6a45ddadfd89780001dff50b' },
];
function about() {
  return `<section class="px">${sh('關於習慣深潛', 'ABOUT')}
    <p>嗨，我是 Harry，喜歡潛水，也在努力每週寫文章。這個遊戲是我為了讓自己持續寫作和運動而做的：每天寫下最重要的事，完成就開寶箱，收集我在海裡遇過（或還在等）的生物。</p>
    <p class="dim">從浮潛客一路升到潛水教練的稱號、圖鑑裡的鬼蝠魟和翻車魚，都來自我的潛水經驗。希望它也能陪你一點一點往前進。</p></section>
  <section class="px">${sh('我的文章', 'READ')}
    ${ABOUT_LINKS.map(l => `<a class="link" href="${l.url}" target="_blank" rel="noopener">
      <span class="sp"><b>${esc(l.title)}</b><br><small>${esc(l.sub)}</small></span><span class="dim">↗</span></a>`).join('')}</section>
  <section class="px">${sh('資料與隱私', 'PRIVACY')}
    <div class="mini">你的紀錄只存在你自己的瀏覽器裡，不會上傳到任何伺服器，我也看不到。記得定期到「紀錄」下載備份。</div>
    <div class="mini">本工具為個人作品，與方格子 vocus 官方無關。</div></section>`;
}

/* ========= 事件 ========= */
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 2600);
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const v = b.dataset.v;
  switch (b.dataset.act) {
    case 'tab': if (UI.shopEdit) finishShop(); if (UI.habEdit) finishHabits(); UI.tab = v; render(); break;
    case 'pday': UI.pday = +v; render(); break;
    case 'start': startTimer(); break;
    case 'skipbreak': {
      const T = S.timer;
      if (T && T.segs[T.si].m === 'break') { T.start = Date.now() - T.segs[T.si].min * 60e3; tick(); }
      break;
    }
    case 'pomoset': S.pomoMin = +v; save(); render(); break;
    case 'cancel':
      if (await ask('結束這段工作階段？\n目前這段專注不會有獎勵，已完成的段落會保留。', '結束', '繼續')) { S.timer = null; save(); render(); tick(); }
      break;
    case 'askyes': ask.res && ask.res(true); break;
    case 'askno': ask.res && ask.res(false); break;
    case 'habedit': UI.habEdit = true; render(); break;
    case 'habdone': finishHabits(); render(); toast('習慣已更新'); break;
    case 'habadd':
      if (customCount() >= CONFIG.maxCustom) break;
      S.habits.push({ id: 'h' + rid(), e: '⭐', n: '', kind: 'custom', weeks: 0, target: 1 }); save(); render(); break;
    case 'gcatadd': S.gcats.push({ id: 'g' + rid(), e: '🔖', n: '' }); save(); render(); break;
    case 'gcatdel': S.gcats[+v].off = true; save(); render(); break;
    case 'habrestore': { const h = S.habits.find(x => x.id === v); h.off = false; save(); render(); break; }
    case 'habdel': {
      const h = S.habits[+v];
      if (!(await ask(`刪除習慣「${h.e} ${h.n || '（未命名）'}」？\n過去的紀錄會保留，只是不再顯示和計算。`, '刪除'))) break;
      h.off = true; save(); render(); break;
    }
    case 'vcfg': {
      const V = habit('vocus');
      V.weeks = +document.getElementById('vW').value; V.target = +document.getElementById('vT').value;
      S.vocusSet = true; save(); render(); toast(`設定好了：每 ${V.weeks} 週至少 ${V.target} 篇`); break;
    }
    case 'shopedit': S.shop = shopItems().map(x => ({ ...x })); UI.shopEdit = true; render(); break;
    case 'shopadd': S.shop.push({ id: 'c' + Date.now(), icon: '🎁', name: '', price: 100 }); save(); render(); break;
    case 'shopdel': S.shop.splice(+v, 1); save(); render(); break;
    case 'shopdone': finishShop(); render(); toast('商店已更新'); break;
    // 發文：在 ✍️ Vocus 項目打勾後勾「發布了文章」。不論在第幾項，每天第一篇開寶箱（防刷），補登昨天不開
    case 'pub': {
      const it = getPlan(viewDay())[v];
      it.pub = { ...(it.pub || {}), on: !(it.pub && it.pub.on) };
      if (it.pub.on) { ac(); SFX.tap(); }
      reward(() => {}, UI.pday === 0);
      break;
    }
    case 'openchest': openChest(); break;
    case 'close': UI.opened = false; nextChest(); break;
    case 'mute':
      S.mute = !S.mute; save(); render();
      if (!S.mute) { ac(); SFX.tap(); }   // 打開時響一聲，確認有聲音
      toast(S.mute ? '音效已關閉' : '音效已開啟'); break;
    case 'fact': { const c = CR[v]; toast(`${c.name}：${c.fact}`); break; }
    case 'pdone': {
      const d = viewDay(), it = getPlan(d)[v], c = catOf(it.cat);
      if (UI.pday > 0) break;
      if (!it.text.trim()) { toast('先寫下這件事'); render(); break; }
      it.done = !it.done;
      if (it.done) ac();
      // 只有「今天」打勾才開寶箱，每一格一天只抽一次；昨天的補勾只算連續天數。
      // 勾錯可以取消：獎勵先收進 it.held，再勾回來就原封不動還回去（不重抽）
      reward(() => {
        if (UI.pday !== 0) { if (it.done) SFX.tap(); return; }
        if (!it.done) {
          let i = S.logs.findIndex(l => it.lid && l.id === it.lid);
          if (i < 0 && it.rw) {
            // 舊版打勾沒記下是哪一筆：找同一天、同分類、還沒被其他項目認領的那筆
            const linked = new Set(Object.values(S.plans).flat().map(x => x.lid).filter(Boolean));
            for (let j = S.logs.length - 1; j >= 0; j--) {
              const l = S.logs[j];
              if (l.k === 'check' && l.d === d && l.tag === c.n && !linked.has(l.id)) { i = j; break; }
            }
          }
          if (i >= 0) { it.lid = S.logs[i].id; it.held = S.logs.splice(i, 1)[0]; toast('已取消，這一項的獎勵先收回（再勾回來會還你）'); }
          return;
        }
        if (it.held) { S.logs.push(it.held); delete it.held; SFX.tap(); toast('已恢復這一項的獎勵'); return; }
        if (it.rw || +v >= CONFIG.rewardRows) { SFX.tap(); return; }
        it.rw = true;
        it.lid = grant('check', c.n, { title: `${c.e} ${it.text} ✔`, xp: it.cat === 'exercise' ? CONFIG.xp.exercise : CONFIG.xp.check }).id;
      }, UI.pday === 0);
      break;
    }
    case 'plansave': {
      const d = viewDay();
      if (!filled(getPlan(d)).length) { toast('至少寫下一件重要的事'); break; }
      ac(); reward(() => grant('plan', null, { key: 'plan:' + d, d, title: '今天的清單寫好了！' })); break;
    }
    case 'redeem': {
      const it = shopItems().find(x => x.id === v);
      if (derive().coins < it.price || !(await ask(`用 ${it.price} 金幣兌換「${it.name}」？`, '兌換'))) break;
      S.logs.push({ id: rid(), t: Date.now(), d: dayKey(), k: 'redeem', name: it.name, c: -it.price });
      save(); render(); SFX.buy(); toast(`${it.icon} 兌換成功，去享受吧！`); break;
    }
    case 'export': {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }));
      a.download = `習慣深潛-備份-${dayKey()}.json`; a.click(); break;
    }
    case 'import': document.getElementById('importFile').click(); break;
    case 'linknew':
      try { await attach(await showSaveFilePicker({ suggestedName: '習慣深潛-存檔.json', types: FILE_TYPES }), true); toast('已連結，之後每次操作都會自動寫入'); } catch (e) {}
      break;
    case 'linkopen':
      try {
        const [h] = await showOpenFilePicker({ types: FILE_TYPES });
        if (await h.requestPermission({ mode: 'readwrite' }) === 'granted') { await attach(h, false); toast('已連結存檔'); }
      } catch (e) {}
      break;
    case 'relink':
      try { if (await FS.handle.requestPermission({ mode: 'readwrite' }) === 'granted') await attach(FS.handle, false); } catch (e) {}
      break;
  }
});
// 輸入框只存資料不重畫，避免打字時失去焦點；換分類、換頻率要重畫（欄位會變）
document.addEventListener('input', e => {
  const el = e.target, i = el.dataset.i;
  if (el.dataset.sf) { S.shop[el.dataset.si][el.dataset.sf] = el.dataset.sf === 'price' ? +el.value : el.value; save(); return; }
  if (el.id === 'pomoMin') {
    const m = Math.round(+el.value);
    if (m >= 5 && m <= 120) {
      S.pomoMin = m; save();
      const p = document.getElementById('pomoPlan');
      if (p) p.innerHTML = sessionPlan(m).map(x => `<span>${x.m === 'break' ? '休息' : '專注'} ${x.min}</span>`).join('<span>›</span>');
    }
    return;
  }
  if (el.dataset.gf) { S.gcats[el.dataset.gi][el.dataset.gf] = el.value; save(); return; }
  if (el.dataset.hf) {
    const h = S.habits[el.dataset.hi], f = el.dataset.hf;
    h[f] = f === 'weeks' || f === 'target' ? +el.value : el.value;
    save(); if (f === 'weeks') render();
    return;
  }
  if (i === undefined) return;
  const it = getPlan(viewDay())[i];
  if (el.dataset.pub) it.pub = { ...(it.pub || { on: true }), title: el.value };
  else if (el.dataset.pf) {
    it[el.dataset.pf] = el.value;
    if (el.dataset.pf === 'cat') render();
  } else if (el.dataset.ex) {
    it.ex = it.ex || { type: ETAGS[0] };
    it.ex[el.dataset.ex] = el.dataset.ex === 'dist' || el.dataset.ex === 'min' ? (el.value === '' ? '' : +el.value) : el.value;
    const p = document.getElementById('pace' + i); if (p) p.textContent = paceText(it.ex);
  }
  save();
});
document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (!Array.isArray(j.logs)) throw 0;
    if (await ask(`備份檔有 ${j.logs.length} 筆紀錄，目前有 ${S.logs.length} 筆。\n確定用備份取代目前資料？`, '還原')) {
      S = migrate(Object.assign(blank(), j)); save(); render(); toast('已還原');
    }
  } catch (err) { toast('這不是有效的備份檔'); }
});

document.addEventListener('keydown', e => {
  if (document.getElementById('askov').classList.contains('hidden') || !ask.res) return;
  if (e.key === 'Enter') { e.preventDefault(); ask.res(true); }
  if (e.key === 'Escape') { e.preventDefault(); ask.res(false); }
});

/* ========= 啟動 ========= */
(async function init() {
  const bub = document.getElementById('bubbles');
  for (let i = 0; i < 10; i++) {
    const s = 3 + (i % 3) * 2;
    bub.insertAdjacentHTML('beforeend', `<i style="left:${(i * 37 + 7) % 100}%;width:${s}px;height:${s}px;animation-duration:${9 + (i * 7) % 11}s;animation-delay:-${(i * 3) % 13}s"></i>`);
  }
  try {
    const h = await idb.get('handle');
    if (h) {
      FS.handle = h;
      FS.ok = (await h.queryPermission({ mode: 'readwrite' })) === 'granted';
      if (FS.ok && S.logs.length <= 1) await attach(h, false);
    }
  } catch (e) {}
  render(); tick();
  setInterval(tick, 500);
  if (!derive().claimed.has('welcome')) { grant('welcome', null, { key: 'welcome' }); save(); render(); nextChest(); }
  // 跨過換日時間時重新整理畫面
  let lastDay = dayKey();
  setInterval(() => { if (dayKey() !== lastDay) { lastDay = dayKey(); render(); } }, 30e3);
})();
</script>
