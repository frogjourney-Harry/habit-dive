<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>習慣深潛</title>
<meta name="description" content="像素風的習慣養成遊戲：每天寫下最重要的事，完成就開寶箱、收集水下生物。資料只存在你自己的瀏覽器。">
<meta name="theme-color" content="#0b2546">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="習慣深潛">
<!-- 不載入任何外部資源；所有資料只存在使用者自己的瀏覽器（localStorage），不會上傳。 -->
<style>
:root{
  --bg:#06152b; --panel:#0d2442; --panel2:#12305a; --edge:#1f4673; --edge-hi:#2f6299;
  --ink:#eaf2ff; --dim:#8aa9cc; --faint:#5b7ca3; --line:rgba(138,169,204,.16);
  --coin:#ffcd75; --coin-d:#c59a3c; --xp:#73eff7; --ok:#5fd38d; --warn:#f2945f;
  --r0:#94b0c2; --r1:#38b764; --r2:#41a6f6; --r3:#b267e6; --r4:#ffcd75;
}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);background:var(--bg);min-height:100vh;
  font:16px/1.6 "Cascadia Mono",Consolas,"Microsoft JhengHei UI","Microsoft JhengHei",monospace}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,
  #174673 0 12%,#133c66 12% 28%,#0f3157 28% 46%,#0b2646 46% 66%,#081b36 66% 84%,#06152b 84%)}
.bubbles i{position:fixed;bottom:-12px;width:6px;height:6px;background:rgba(115,239,247,.2);z-index:-1;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh)}}
@media (prefers-reduced-motion:reduce){.bubbles{display:none}}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 40px}
a{color:var(--xp)}
.px{background:var(--panel);margin:0 3px 16px;padding:14px 16px;
  box-shadow:0 -3px 0 var(--edge),0 3px 0 var(--edge),-3px 0 0 var(--edge),3px 0 0 var(--edge)}
.sh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.sh b{font-size:17px;letter-spacing:.04em}
.sh em{font-style:normal;font-size:11px;letter-spacing:.24em;color:var(--faint)}
.sub{margin:16px 0 6px;font-size:14px;color:var(--dim);letter-spacing:.04em}
button{font:inherit;font-size:15px;color:var(--ink);background:transparent;border:0;padding:5px 12px;margin:4px 3px;cursor:pointer;
  box-shadow:0 -2px 0 var(--edge-hi),0 2px 0 var(--edge-hi),-2px 0 0 var(--edge-hi),2px 0 0 var(--edge-hi)}
button:hover{background:rgba(115,239,247,.08)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.35;cursor:not-allowed;transform:none}
button:focus{outline:none}
button.pri{background:var(--coin);color:#1a1c2c;font-weight:bold;
  box-shadow:0 -2px 0 #fff0c0,0 2px 0 var(--coin-d),-2px 0 0 var(--coin-d),2px 0 0 var(--coin-d)}
button.pri:hover{background:#ffd98f}
button.sel{color:var(--xp);background:rgba(115,239,247,.08);
  box-shadow:0 -2px 0 var(--xp),0 2px 0 var(--xp),-2px 0 0 var(--xp),2px 0 0 var(--xp)}
button.ghost{box-shadow:none;color:var(--dim);padding:3px 6px}
button.ghost:hover{color:var(--ink);background:none}
button.wide{display:block;width:100%;margin:8px 0;padding:10px}
small,.dim{color:var(--dim)}
b{color:#fff}
.hidden{display:none!important}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
input,select{font:inherit;font-size:16px;color:var(--ink);background:#071a33;border:0;padding:5px 8px;box-shadow:inset 0 0 0 2px var(--edge);color-scheme:dark}
input:focus,select:focus{outline:none;box-shadow:inset 0 0 0 2px var(--xp)}
input::placeholder{color:var(--faint)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);box-shadow:none;cursor:pointer;flex:none}
.cn{display:inline-block;width:12px;height:12px;margin-left:4px;vertical-align:-1px;background:var(--coin);
  box-shadow:inset -2px -2px 0 var(--coin-d),inset 2px 2px 0 #fff0c0}
.label{font-size:12px;letter-spacing:.2em;color:var(--faint)}
.mini{font-size:14px;color:var(--dim);margin-top:4px}
.warn{color:var(--warn);font-size:14px;margin-top:8px}
.done-tag{color:var(--ok)}
.coin{color:var(--coin);font-weight:bold}
.bar{height:10px;background:#071a33;box-shadow:inset 0 0 0 2px var(--edge);margin:6px 0}
.bar i{display:block;height:100%;background:var(--xp)}
.bar.c i{background:var(--coin)}

/* 頂端：名稱＋等級＋金幣（只出現這一次） */
.brand{display:flex;align-items:center;gap:10px;margin:2px 3px 14px}
.brand #logo .sprite{margin:0}
.brand b{font-size:20px;letter-spacing:.12em}
.brand em{font-style:normal;font-size:11px;letter-spacing:.3em;color:var(--faint)}
.top-stat{display:flex;align-items:center;gap:10px}
.lvchip{margin:0;padding:3px 10px;font-size:14px;color:var(--xp);box-shadow:0 -2px 0 var(--edge-hi),0 2px 0 var(--edge-hi),-2px 0 0 var(--edge-hi),2px 0 0 var(--edge-hi)}
.lvchip small{margin-left:6px;color:var(--dim)}
.top-stat .coin{font-size:18px}
nav{display:flex;flex-wrap:wrap;margin:0 3px 16px;box-shadow:inset 0 -2px 0 var(--edge)}
nav button{box-shadow:none;margin:0;padding:8px 14px;color:var(--dim);font-size:15px}
nav button.sel{color:var(--ink);background:none;box-shadow:inset 0 -3px 0 var(--coin)}
.banner{background:#4a2414;margin:0 3px 16px;padding:10px 14px;box-shadow:0 0 0 2px var(--warn);font-size:14px}
.foot{text-align:center;color:var(--faint);font-size:13px;margin-top:8px;letter-spacing:.04em}
.foot a{color:var(--dim);text-decoration:none}

/* 習慣：小卡片，點一下打卡 */
.habits{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.hab{display:block;width:100%;margin:0;padding:8px 10px;text-align:left;background:var(--panel2);font-size:13px;
  box-shadow:inset 3px 0 0 var(--edge-hi)}
.hab:hover{background:#163a6b}
.hab.on{box-shadow:inset 3px 0 0 var(--ok)}
.hab .row{gap:6px;flex-wrap:nowrap}
.hab .hn{font-weight:bold;color:#fff;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hab .hs{color:var(--dim)}
.hab.on .hs{color:var(--ok)}
.streak{color:var(--warn);font-weight:bold;white-space:nowrap}
.streak small{color:var(--warn);font-weight:normal;margin-left:2px}

/* 六件事 */
.prow{display:flex;align-items:center;gap:10px;padding:5px 0}
.prow .ptext{flex:1;min-width:0}
.prow.done .ptext{text-decoration:line-through;color:var(--dim)}
.prow .no{width:14px;text-align:center;color:var(--faint);font-size:14px;flex:none}
.prow select{font-size:14px;padding:4px 4px;flex:none;max-width:42%}
.divider{margin:10px 0 2px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;letter-spacing:.2em;color:var(--faint)}
.seg-switch{display:inline-flex}
.favs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin:2px 0 6px}
.fav{display:inline-flex;align-items:center;background:var(--panel2)}
.fav button{margin:0;padding:3px 2px 3px 9px;font-size:14px;color:var(--ink)}
.fav .x{padding:3px 7px;color:var(--faint)}
.star{flex:none;font-size:18px;color:var(--coin);padding:0 4px;margin:0}
.stages{display:flex;justify-content:center;gap:18px;margin:6px 0}
.stages>div{display:flex;flex-direction:column;align-items:center}
.stages .sprite,.entry .sprite,.erow .sprite{margin:2px auto}
.streakbox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.streakbox div{background:var(--panel2);padding:8px 10px}
.streakbox b{font-size:22px;display:block;color:var(--warn)}
.cal{display:grid;grid-template-columns:40px repeat(7,1fr);gap:3px;max-width:340px;align-items:center}
.cal .wd{text-align:center;font-size:12px;color:var(--faint)}
.cal .wk{font-size:11px;color:var(--faint)}
.cal i{aspect-ratio:1;background:#0f2a4d}
.cal i.l1{background:#1f5a8a}.cal i.l2{background:#2f8fc0}.cal i.l3{background:#73eff7}.cal i.l4{background:#e8ffff}
.cal i.today{outline:2px solid var(--coin);outline-offset:-2px}
.cal i.blank{background:transparent}
.seg-switch button{margin:0 0 0 -2px;padding:3px 12px;font-size:14px}

/* 番茄鐘 */
.pomo-set{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{margin:3px}
.pomo-go{display:flex;align-items:center;gap:8px;margin-left:auto}
.pomo-go input{width:72px}
.timer{text-align:center;box-shadow:0 -3px 0 var(--coin),0 3px 0 var(--coin),-3px 0 0 var(--coin),3px 0 0 var(--coin)}
.clock{font-size:60px;line-height:1.1;color:var(--coin);letter-spacing:4px;font-weight:bold}
.segs{margin:8px 0;font-size:14px;color:var(--dim)}
.segs span{margin:0 4px}
.segs .past{opacity:.4}
.segs .now{color:var(--coin);font-weight:bold}

/* 彈窗 */
.ov{position:fixed;inset:0;background:rgba(2,8,20,.82);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
#sheetov{z-index:9}
.modal{width:min(380px,100%);text-align:center;max-height:90vh;overflow:auto}
.sheet{text-align:left;width:min(440px,100%)}
.sheet h2{font-size:18px}
.modal h2{margin:4px 0 10px;font-size:19px}
.msg{white-space:pre-line;margin:6px 0 14px}
.sprite{image-rendering:pixelated;image-rendering:crisp-edges;display:block;margin:10px auto}
.shake{animation:shake .22s steps(2) infinite}
@keyframes shake{0%{transform:translateX(-4px) rotate(-4deg)}100%{transform:translateX(4px) rotate(4deg)}}
.pop{animation:pop .4s steps(5)}
@keyframes pop{from{transform:scale(.2)}to{transform:scale(1)}}
.rar{display:inline-block;padding:1px 8px;color:#1a1c2c;font-size:14px;letter-spacing:.1em}
.glow3{filter:drop-shadow(0 0 10px var(--r3))}
.glow4{filter:drop-shadow(0 0 14px var(--r4));animation:pop .4s steps(5),gold 1s steps(2) infinite .4s}
@keyframes gold{50%{filter:drop-shadow(0 0 24px #fff3b0)}}
.new{color:var(--coin);font-size:15px;letter-spacing:.1em}
.gain{margin:12px 0;font-size:17px}
.big-lv{font-size:34px;line-height:1;color:var(--xp);font-weight:bold}
.big-lv span{font-size:16px;margin-right:3px}
.entry{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.form{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.form input,.form select{min-width:0}
.form .f-num{width:84px}
.form .f-wide{flex:1 1 100%}

/* 圖鑑 */
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.dex .cell{background:var(--panel2);padding:10px 4px 8px;text-align:center;cursor:pointer;box-shadow:inset 0 -3px 0 var(--rc)}
.dex .cell:hover{background:#163a6b}
.dex .cell.no{background:#0a1d36;cursor:default;box-shadow:none}
.dex .nm{font-size:14px}
.grp{margin:16px 0 8px}

/* 水族箱 */
.tank{display:block;width:100%;height:340px;image-rendering:pixelated;cursor:pointer;touch-action:manipulation;
  box-shadow:0 0 0 2px var(--edge)}

/* 商店 */
.shop .it{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.shop .it:last-child{border-bottom:0}
.shop .ic{font-size:22px;width:32px;text-align:center}
.shop .it .sp{flex:1 1 120px;min-width:0}
.price{color:var(--coin);text-align:right;white-space:nowrap}
.need{text-align:right;font-size:14px;white-space:nowrap}
.goal{background:var(--panel2);padding:12px 14px;margin:12px 0}
.erow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.erow input.sp{flex:1 1 100px;min-width:0}

/* 紀錄 */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:420px}
.heat .wd{text-align:center;font-size:12px;color:var(--faint)}
.heat i{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:var(--dim);background:#0f2a4d}
.heat i.l3,.heat i.l4{color:#0b2546;font-weight:bold}
.heat i.l1{background:#1f5a8a}.heat i.l2{background:#2f8fc0}.heat i.l3{background:#73eff7}.heat i.l4{background:#e8ffff}
.heat i.today{outline:2px solid var(--coin);outline-offset:-2px}
.heat i.blank{background:transparent}
.legend{display:flex;align-items:center;gap:4px;margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px}
.stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.stat div{background:var(--panel2);padding:8px 12px}
.stat b{font-size:20px;display:block}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.toggle{width:44px;height:22px;padding:0;margin:0;position:relative;background:#071a33;
  box-shadow:0 -2px 0 var(--edge-hi),0 2px 0 var(--edge-hi),-2px 0 0 var(--edge-hi),2px 0 0 var(--edge-hi)}
.toggle i{position:absolute;top:4px;left:4px;width:14px;height:14px;background:var(--faint);transition:left .12s steps(3)}
.toggle.on{background:#1e5a3a;box-shadow:0 -2px 0 var(--ok),0 2px 0 var(--ok),-2px 0 0 var(--ok),2px 0 0 var(--ok)}
.toggle.on i{left:26px;background:var(--ok)}
.link{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.link:last-child{border-bottom:0}
.link:hover b{color:var(--xp)}
.link .sp{min-width:0}
.salon{background:var(--panel2);padding:14px;margin-top:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);padding:10px 18px;z-index:20;
  box-shadow:0 0 0 2px var(--xp);max-width:90vw}

/* ===== 手機版 ===== */
@media (max-width:600px){
  body{font-size:15px}
  .wrap{padding:10px 10px calc(78px + env(safe-area-inset-bottom))}
  .brand{margin:0 2px 10px;gap:8px}
  .brand b{font-size:17px;letter-spacing:.08em}
  .brand em,.lvchip small{display:none}
  .px{padding:12px;margin:0 2px 12px}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:5;margin:0;flex-wrap:nowrap;background:var(--panel);
    box-shadow:0 -2px 0 var(--edge);padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;padding:13px 0 11px;font-size:14px;text-align:center}
  nav button.sel{box-shadow:inset 0 3px 0 var(--coin)}
  .habits{grid-template-columns:1fr 1fr;gap:6px}
  .hab{padding:7px 9px}
  .hab .hn{font-size:14px}
  .presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
  .presets button{margin:0;padding:7px 0}
  .pomo-go{width:100%;margin:6px 0 0}
  .pomo-go .pri{flex:1;padding:8px 0;margin:0 0 0 6px}
  .clock{font-size:50px}
  .stat{grid-template-columns:1fr 1fr}
  .dex{grid-template-columns:repeat(3,1fr);gap:8px}
  .tank{height:300px}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>
<div class="wrap">
  <div class="brand"><span id="logo"></span><b>習慣深潛</b><em>HABIT DIVE</em><span class="sp"></span><div class="top-stat" id="stat"></div></div>
  <div id="banner"></div>
  <nav id="nav"></nav>
  <main id="main"></main>
  <footer class="foot">習慣深潛・made by <a href="https://vocus.cc/salon/frog-journey" target="_blank" rel="noopener">Frog Journey</a></footer>
</div>
<div class="ov hidden" id="ov"><div class="px modal" id="modal"></div></div>
<div class="ov hidden" id="sheetov"><div class="px modal sheet" id="sheet"></div></div>
<div class="ov hidden" id="askov" style="z-index:15"><div class="px modal"><div class="msg" id="askmsg"></div>
  <input id="askin" class="hidden" style="width:100%;margin-bottom:10px">
  <button data-act="askno" id="askno">取消</button><button class="pri" data-act="askyes" id="askyes">確定</button></div></div>
<div class="toast hidden" id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" class="hidden">

<script>
/* ========= 可自行調整的設定 ========= */
const CONFIG = {
  pomodoroMin: 25,            // 一段專注的長度；使用者選的是「整段工作階段」的總長度（5–120 分）
  pomoRewardMin: 20,          // 專注滿這麼多分鐘才開寶箱
  breakMin: 5, longBreakMin: 15, longBreakEvery: 4,   // 工作階段中：每段專注後短休息，每 4 段長休息
  dayStartHour: 4,            // 凌晨 4 點前都算「前一天」
  habitDays: 66,              // Lally et al. 2010：習慣自動化所需天數中位數
  maxCustom: 3,               // 自訂習慣最多幾個（不含內建的六件事、Vocus、運動）
  xp:    { check: 10, habit: 10, exercise: 20, plan: 10, pomo: 10, pubchest: 30, period: 30, top3: 15 },
  coins: { base: 5, rand: 6, critChance: 0.1, period: 40, welcome: 20, top3: 20, pubchest: 25 },
  rewardRows: 3,              // 六件事只有前幾項打勾會開寶箱，其餘只做紀錄
  coinsPerDay: 60,            // 紀錄不夠時，商店用這個速度估計「要努力幾天」
  rarityRates: [55, 28, 12, 4.5, 0.5],   // 普通 / 少見 / 稀有 / 史詩 / 傳說（%）
  dupCoins: [2, 5, 15, 40, 100],         // 抽到重複生物時換成的金幣
  shop: [
    { id: 'tea',     icon: '🧋', name: '喝一杯手搖飲',       price: 300 },
    { id: 'episode', icon: '📺', name: '追一集劇',           price: 300 },
    { id: 'sweet',   icon: '🍰', name: '吃一份甜點',         price: 500 },
    { id: 'meal',    icon: '🍜', name: '吃一頓喜歡的餐廳',   price: 1200 },
    { id: 'buy',     icon: '🛍', name: '買一樣想要很久的東西', price: 3500 },
  ],
  // 六件事的分類（不算連勝）。使用者可在「習慣・編輯」自訂，存在 S.gcats
  generalCats: [
    { id: 'work',  e: '💼', n: '工作' },
    { id: 'study', e: '📚', n: '學習' },
    { id: 'write', e: '✍️', n: '寫作' },
    { id: 'life',  e: '🏠', n: '生活' },
    { id: 'other', e: '📌', n: '其他', ph: '今天最重要的事' },
  ],
};

// 內建習慣（可改名、刪除、加回）。weeks: 0 = 每天；1、2 = 每 1／2 週至少 target 天（Vocus 是篇）
// kind: vocus = 記錄發布的文章、exercise = 可記距離時間、custom = 自訂。六件事只是清單，不算連勝
const DEFAULT_HABITS = [
  { id: 'vocus',    e: '✍️', n: 'Vocus',  kind: 'vocus',    weeks: 1, target: 1 },
  { id: 'exercise', e: '🏃', n: '運動',   kind: 'exercise', weeks: 1, target: 3 },
];
const ETAGS = ['跑步', '游泳', '重訓', '潛水', '登山', '其他'];
const RARITY = [
  { name: '普通', color: 'var(--r0)' }, { name: '少見', color: 'var(--r1)' }, { name: '稀有', color: 'var(--r2)' },
  { name: '史詩', color: 'var(--r3)' }, { name: '傳說', color: 'var(--r4)' },
];
// 等級稱號照潛水證照的進階路線：[從幾級開始, 稱號]
const RANKS = [
  [1, '浮潛客'], [3, '體驗潛水員'], [5, '開放水域潛水員'], [8, '進階潛水員'], [12, '救援潛水員'],
  [16, '潛水長'], [20, '潛水教練'], [25, '技術潛水員'], [30, '深海探險家'], [40, '海洋傳說'],
];

const spriteCache = {};
function spriteURL(rows, sil) {
  const key = rows.join('|') + sil;
  if (spriteCache[key]) return spriteCache[key];
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const x = cv.getContext('2d');
  rows.forEach((r, j) => [...r].forEach((ch, i) => {
    if (ch === '.' || !PAL[ch]) return;
    x.fillStyle = sil ? '#1b3a60' : PAL[ch]; x.fillRect(i, j, 1, 1);
  }));
  return spriteCache[key] = { src: cv.toDataURL(), w, h };
}
function img(rows, scale, sil = false, cls = '') {
  const s = spriteURL(rows, sil);
  return `<img class="sprite ${cls}" src="${s.src}" width="${s.w * scale}" height="${s.h * scale}" alt="">`;
}

const pad = n => String(n).padStart(2, '0');

const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };

const EPOCH = '2026-01-05'; // 一個星期一，兩週為一期時從這天起算
function periodKey(d, weeks) {
  const w = weekKey(d);
  if (weeks <= 1) return w;
  const days = Math.round((parseKey(w) - parseKey(EPOCH)) / 864e5);
  return addDays(EPOCH, Math.floor(days / (7 * weeks)) * 7 * weeks);
}

  if (!s.gcats) {
    s.gcats = CONFIG.generalCats.map(c => ({ ...c }));
    if (Object.values(s.plans).some(P => P.some(it => it.cat === 'digital')))
      s.gcats.unshift({ id: 'digital', e: '📘', n: '數位商品' });
  }
  if (!s.gcats.some(c => c.id === 'other')) s.gcats.push({ ...CONFIG.generalCats[CONFIG.generalCats.length - 1] });

}

// XP、金幣、圖鑑由 logs 算；習慣完成由卡片打卡（S.checks）算，加上舊版的六件事打勾與紀錄
function derive() {
  const D = { xp: 0, coins: 0, col: {}, days: {}, per: {}, articles: 0, claimed: new Set() };
  const inc = (d, k, n = 1) => { const x = D.days[d] || (D.days[d] = {}); x[k] = (x[k] || 0) + n; };
  for (const l of S.logs) {
    D.xp += l.xp || 0; D.coins += l.c || 0;
    if (l.drop) D.col[l.drop] = (D.col[l.drop] || 0) + 1;
    if (l.key) D.claimed.add(l.key);
    if (['wake', 'research', 'exercise'].includes(l.k) && !l.late) inc(l.d, l.k);
    if (l.k === 'article') inc(l.d, 'vocus');
  }
  for (const [d, C] of Object.entries(S.checks)) for (const [id, arr] of Object.entries(C))
    if (arr.length) inc(d, id, id === 'vocus' ? arr.length : 1);
  for (const x of Object.values(D.days)) D.articles += x.vocus || 0;
  // 週期型習慣：Vocus 算篇數，其他算「有做的天數」（一天做兩次也只算一天）
  for (const h of activeHabits()) if (h.weeks) for (const [d, x] of Object.entries(D.days)) if (x[h.id]) {
    const k = h.id + '@' + periodKey(d, h.weeks);
    D.per[k] = (D.per[k] || 0) + (h.kind === 'vocus' ? x[h.id] : 1);
  }
  return D;
}

// 每天的習慣「不連續漏兩次」：漏一次不斷，連續漏兩次才歸零；進行中的今天不算漏。
// 週期型習慣漏一期就斷：週期本身已經是自己選的寬鬆度
function chain(isDone, cur, step, first, maxMiss) {
  let n = isDone(cur) ? 1 : 0, miss = 0, k = step(cur);
  const prevMissed = !isDone(k);
  while (k >= first) {
    if (isDone(k)) { n++; miss = 0; } else if (++miss >= maxMiss) break;
    k = step(k);
  }
  return { n, risk: maxMiss > 1 && n > 0 && !isDone(cur) && prevMissed };
}
function streaks(D) {
  const today = dayKey(), first = Object.keys(D.days).sort()[0] || today, out = {};
  for (const h of activeHabits()) out[h.id] = h.weeks
    ? chain(p => periodDone(D, h, p), periodKey(today, h.weeks), p => addDays(p, -7 * h.weeks), periodKey(first, h.weeks), 1)
    : chain(d => dayDone(D, d, h.id), today, d => addDays(d, -1), first, 2);
  return out;
}

    if (Math.random() < CONFIG.coins.critChance) { crit = true; c *= 2; }
  }
  const dup = isNew ? 0 : CONFIG.dupCoins[cr.r];
  const log = { id: rid(), t: Date.now(), d: o.d || dayKey(), k: kind, tag: tag || undefined, xp, c: c + dup, drop: cr.id, key: o.key, ...o.extra };
  S.logs.push(log);
  Q.push({ title, cr, isNew, xp, c, dup, crit, owned: (D.col[cr.id] || 0) + 1 });
  if (pets(cr.id).length > MAX_PETS) Q.push({ release: cr.id, newId: log.id });
  return log;
}
// 今天的寶箱（前三件、每個習慣的打卡、週期達標）跟著條件走：條件不再成立時把獎勵收進 S.held，
// 條件恢復時原封不動還回來（不重抽，避免用取消再打卡刷稀有生物）
function reconcile(allowGrant) {
  const d = dayKey(), P = S.plans[d] || [], R = CONFIG.rewardRows;
  S.held = S.held || {};
  // 前三格都要有寫內容、而且都打勾才算
  const conds = [['top3:' + d, 'top3', P.length >= R && P.slice(0, R).every(x => x.text.trim() && x.done)]];
  for (const h of activeHabits()) {
    const has = dayChecks(d, h.id).length > 0;
    if (h.kind === 'vocus') conds.push(['art:' + d, 'pubchest', has]);
    else conds.push([`hab:${h.id}:${d}`, 'habit', has, `${h.e} ${h.n} 打卡完成！`, h.kind === 'exercise' ? CONFIG.xp.exercise : CONFIG.xp.habit]);
    if (h.weeks && h.kind !== 'vocus') {
      const p = periodKey(d, h.weeks);
      conds.push([h.id === 'exercise' && h.weeks === 1 ? 'week:' + p : `per:${h.id}:${p}`, 'period',
        periodDone(derive(), h, p), `${h.e} ${h.n} ${periodWord(h)}達標！額外寶箱`]);
    }
  }
  for (const [key, kind, ok, title, xp] of conds) {
    const has = derive().claimed.has(key);
    if (ok && !has) {
      if (S.held[key]) { S.logs.push(S.held[key]); delete S.held[key]; }
      else if (allowGrant) grant(kind, null, { key, title, xp });
    } else if (!ok && has) {
      const i = S.logs.findIndex(l => l.key === key);
      if (i >= 0) S.held[key] = S.logs.splice(i, 1)[0];
    }
  }
}
// 做完 fn 之後檢查寶箱與升級，再存檔、播寶箱。補登昨天時 allowGrant=false：只還原、不發新獎勵
function reward(fn, allowGrant = true) {
  const before = levelOf(derive().xp);
  fn();
  reconcile(allowGrant);
  const after = levelOf(derive().xp);
  if (after > before) Q.push({ level: after, title: rankIdx(after) > rankIdx(before) ? RANKS[rankIdx(after)][1] : '' });
  save(); render(); renderSheet(); nextChest();
}

/* ========= 番茄鐘 ========= */
// 一段「專注工作階段」：選整段總長度，自動切成「專注 25 分＋休息」的段落；每段專注滿 pomoRewardMin 分鐘開一個寶箱
const pomoMin = () => S.pomoMin || CONFIG.pomodoroMin;
function sessionPlan(total) {
  const segs = [];
  let rem = total, focusN = 0;
  while (rem > 0) {
    const f = Math.min(CONFIG.pomodoroMin, rem);
    segs.push({ m: 'focus', min: f }); rem -= f; focusN++;
    if (rem <= 0) break;
    const b = focusN % CONFIG.longBreakEvery === 0 ? CONFIG.longBreakMin : CONFIG.breakMin;
    if (rem <= b + 5) { segs[segs.length - 1].min += rem; break; }   // 只剩一點點就併進這段專注，不以休息收尾
    segs.push({ m: 'break', min: b }); rem -= b;
  }
  return segs;
}
function startTimer() {
  if (S.timer) return;
  ac();
  S.timer = { segs: sessionPlan(pomoMin()), si: 0, start: Date.now() };
  SFX.tap(); save(); render(); tick();
}
function finishSeg() {
  const T = S.timer, seg = T.segs[T.si], end = T.start + seg.min * 60e3, last = T.si === T.segs.length - 1;
  if (last) S.timer = null; else { T.si++; T.start = end; }
  const next = S.timer && S.timer.segs[S.timer.si];
  SFX.done();
  if (seg.m === 'focus') {
    const d = dayKey(end - 1);
    if (seg.min >= CONFIG.pomoRewardMin) reward(() => grant('pomo', null, { title: `專注 ${seg.min} 分鐘完成！`, d, extra: { min: seg.min } }));
    else { S.logs.push({ id: rid(), t: end, d, k: 'pomo', min: seg.min, xp: 0, c: 0 }); save(); render(); }
  } else { save(); render(); }
  toast(last ? '這段專注全部完成！' : next.m === 'break' ? `休息 ${next.min} 分鐘，起來走走吧` : `休息結束，繼續專注 ${next.min} 分鐘`);
}
function tick() {
  if (!S.timer) { document.title = '習慣深潛'; return; }
  let T = S.timer;
  if (!T.segs) S.timer = T = { segs: [{ m: T.mode === 'break' ? 'break' : 'focus', min: Math.round(T.dur / 60e3) }], si: 0, start: T.start };
  if (Date.now() >= T.start + T.segs[T.si].min * 60e3) {
    while (S.timer && Date.now() >= S.timer.start + S.timer.segs[S.timer.si].min * 60e3) finishSeg();
    return;
  }
  const seg = T.segs[T.si], dur = seg.min * 60e3, left = T.start + dur - Date.now();
  const txt = `${pad(Math.floor(left / 60000))}:${pad(Math.floor(left / 1000) % 60)}`;
  document.title = `${seg.m === 'break' ? '休息' : '專注'} ${txt}・習慣深潛`;
  const el = document.getElementById('tclock'); if (el) el.textContent = txt;
  const bar = document.getElementById('tbar'); if (bar) bar.style.width = (100 - left / dur * 100) + '%';
}

const EX_FIELDS = {
  '跑步': [['dist', '距離', 'km', .1], ['min', '時間', '分鐘', 1]],
  '游泳': [['m', '距離', '公尺', 50], ['min', '時間', '分鐘', 1]],

  '潛水': [['depth', '最大深度', '公尺', 1], ['min', '潛水時間', '分鐘', 1], ['site', '潛點', '', 0]],
  '登山': [['dist', '距離', 'km', .1], ['gain', '爬升', '公尺', 10], ['min', '時間', '分鐘', 1]],
  '其他': [['min', '時間', '分鐘', 1]],
};
const fmtPace = sec => { const s = Math.round(sec); return `${Math.floor(s / 60)}'${pad(s % 60)}"`; };
const swimMeters = e => e.m || (e.type === '游泳' && e.dist ? e.dist * 1000 : 0);
function paceText(e) {
  if (!(e.min > 0)) return '';
  if (e.type === '跑步' && e.dist > 0) return `配速 ${fmtPace(e.min * 60 / e.dist)}/km`;
  if (e.type === '游泳' && swimMeters(e) > 0) return `配速 ${fmtPace(e.min * 60 / (swimMeters(e) / 100))}/100m`;
  return '';
}
function exText(e) {
  const parts = [e.type];
  if (e.type === '游泳') { if (swimMeters(e)) parts.push(`${swimMeters(e)} m`); }
  else if (e.dist) parts.push(`${e.dist} km`);
  if (e.depth) parts.push(`最大 ${e.depth} m`);
  if (e.gain) parts.push(`爬升 ${e.gain} m`);
  if (e.min) parts.push(`${e.min} 分`);
  parts.push(paceText(e), e.site, e.note);
  return parts.filter(Boolean).join('・');
}

/* ========= 生物個體與成長 ========= */
// 每一隻生物＝一筆抽到牠的紀錄（log.drop）；放生的記在 S.released。每種最多養 MAX_PETS 隻
const MAX_PETS = 5;
const GROW = [0, 10, 30];                                  // 吃到幾顆：幼體 → 成體 → 閃耀
const STAGE_NAME = ['幼體', '成體', '閃耀'];
const fedOf = key => (S.fed && S.fed[key]) || 0;
const stageOf = n => GROW.filter(t => n >= t).length;
const inTank = id => !(S.outTank && S.outTank[id]);
function pets(sp) {
  return S.logs.filter(l => l.drop === sp && !(S.released && S.released[l.id])).map(l => ({ id: l.id, fed: fedOf(l.id) }));
}
// 圖鑑裡解鎖到第幾種外觀：看過的最高型態（放生了也算看過）
const seenStage = sp => Math.max(1, (S.seen && S.seen[sp]) || 1, ...pets(sp).map(p => stageOf(p.fed)));
const mixHex = (a, b, t) => '#' + [1, 3, 5].map(i => Math.round(parseInt(a.substr(i, 2), 16) * (1 - t) + parseInt(b.substr(i, 2), 16) * t).toString(16).padStart(2, '0')).join('');
// 三種外觀：幼體顏色淡一點、成體是原圖、閃耀多一圈金邊
const stageCv = {};
function stageCanvas(c, s) {
  const key = c.id + s; if (stageCv[key]) return stageCv[key];
  const rows = c.px, w = Math.max(...rows.map(r => r.length)), h = rows.length, b = s === 3 ? 1 : 0;
  const cv = document.createElement('canvas'); cv.width = w + 2 * b; cv.height = h + 2 * b;
  const x = cv.getContext('2d');
  const on = (i, j) => j >= 0 && j < h && i >= 0 && i < rows[j].length && rows[j][i] !== '.' && !!PAL[rows[j][i]];
  if (s === 3) {
    x.fillStyle = '#ffcd75';
    for (let j = -1; j <= h; j++) for (let i = -1; i <= w; i++)
      if (!on(i, j) && (on(i - 1, j) || on(i + 1, j) || on(i, j - 1) || on(i, j + 1))) x.fillRect(i + b, j + b, 1, 1);
  }
  rows.forEach((r, j) => [...r].forEach((ch, i) => {
    if (!on(i, j)) return;
    x.fillStyle = s === 1 ? mixHex(PAL[ch], '#ffffff', .35) : PAL[ch]; x.fillRect(i + b, j + b, 1, 1);
  }));
  return stageCv[key] = cv;
}
const stageUrl = {};
function stageImg(c, s, scale, sil = false, cls = '') {
  const key = c.id + s + sil;
  if (!stageUrl[key]) {
    const src = stageCanvas(c, s), cv = document.createElement('canvas'); cv.width = src.width; cv.height = src.height;
    const x = cv.getContext('2d'); x.drawImage(src, 0, 0);
    if (sil) { x.globalCompositeOperation = 'source-in'; x.fillStyle = '#1b3a60'; x.fillRect(0, 0, cv.width, cv.height); }
    stageUrl[key] = { src: cv.toDataURL(), w: cv.width, h: cv.height };
  }
  const u = stageUrl[key];
  return `<img class="sprite ${cls}" src="${u.src}" width="${u.w * scale}" height="${u.h * scale}" alt="">`;
}

function dex(D) {
  const total = CONFIG.rarityRates.reduce((a, b) => a + b, 0);
  return `<section class="px">${sh('水下生物圖鑑', 'COLLECTION', `<span class="dim">${Object.keys(D.col).length} / ${CREATURES.length}</span>`)}
    <div class="mini">完成事情就會開寶箱。點已收集的生物看介紹、成長型態，也可以放生。</div>
    ${RARITY.map((R, r) => `<div class="grp row"><span class="rar" style="background:${R.color}">${R.name}</span>
      <small>掉落率 ${(CONFIG.rarityRates[r] / total * 100).toFixed(1).replace('.0', '')}%</small></div>
      <div class="dex">${CREATURES.filter(c => c.r === r).map(c => D.col[c.id]
        ? `<div class="cell" style="--rc:${R.color}" data-act="fact" data-v="${c.id}">${stageImg(c, seenStage(c.id), 5)}<div class="nm">${c.name}</div><small>${pets(c.id).length} 隻</small></div>`
        : `<div class="cell no">${img(c.px, 5, true)}<div class="nm dim">？？？</div><small>&nbsp;</small></div>`).join('')}</div>`).join('')}</section>`;
}

/* ========= 水族箱小遊戲 ========= */
// 你養的生物會在這裡游；點水面撒飼料，吃到的那一隻會長大；點生物看名字和型態
// 每種生物的體型（相對大小）與游速，照真實生物的感覺；第三個值＝在海底爬
const TANK_SPECIES = {
  clown: [1, .45], damsel: [.9, .6], butterfly: [1, .4], star: [1, .05, 1], hermit: [1, .18, 1], urchin: [1, .04, 1],
  turtle: [1.7, .2], octopus: [1.3, .25], nudi: [.9, .07, 1], lion: [1.3, .2], puffer: [1.1, .25], cuttle: [1.3, .35],
  seahorse: [1, .1], shark: [2.3, .7], moray: [1.8, .3], jelly: [1.3, .08], manta: [2.6, .35], mola: [2.3, .15],
  dolphin: [2.2, .9], whaleshark: [3.3, .2],
};
const STAGE_SCALE = [.75, 1, 1.1];
const FEED = { free: 3, pack: 10, price: 30 };            // 每天免費 3 顆；商店 30 金幣買 10 顆
// 水族箱設定：S.tankCfg[物種] = { size: 0.6／1／1.3 }；哪幾隻放進去記在 S.outTank
const SIZES = [[.6, '小'], [1, '標準'], [1.3, '大']];
const tankSize = id => (S.tankCfg && S.tankCfg[id] && S.tankCfg[id].size) || 1;
const freeLeft = () => S.feedDay && S.feedDay.d === dayKey() ? Math.max(0, FEED.free - S.feedDay.used) : FEED.free;
const feedLeft = () => freeLeft() + (S.feed || 0);
function useFeed() {
  if (freeLeft() > 0) { if (!S.feedDay || S.feedDay.d !== dayKey()) S.feedDay = { d: dayKey(), used: 0 }; S.feedDay.used++; }
  else if ((S.feed || 0) > 0) S.feed--;
  else return false;
  save(); return true;
}
const TANK = { raf: 0 };
function tankFeedText() {
  const f = freeLeft(), b = S.feed || 0;
  return `飼料：今天免費 ${f}/${FEED.free}${b ? `・另有 ${b} 顆` : ''}`;
}
function tankEditor(D) {
  const owned = CREATURES.filter(c => pets(c.id).length);
  return `<section class="px">${sh('水族箱設定', 'AQUARIUM', '<button class="pri" data-act="tankdone">完成</button>')}
    <div class="mini">勾選要放進水族箱的個體，也可以調整每種生物的大小。想送走某一隻，到圖鑑點牠就能放生。</div>
    ${owned.map(c => {
      const P = pets(c.id);
      return `<div class="erow">${stageImg(c, seenStage(c.id), 2)}<span class="sp">${c.name}</span>
        <select data-tf="size" data-tv="${c.id}">${SIZES.map(([v, l]) => `<option value="${v}" ${tankSize(c.id) === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <div class="row" style="flex-basis:100%;gap:10px;padding-left:4px">${P.map((p, i) => `<label class="row" style="gap:4px"><input type="checkbox" data-act="intank" data-v="${p.id}" ${inTank(p.id) ? 'checked' : ''}>
          <small>${P.length > 1 ? `${i + 1} 號 ` : ''}${STAGE_NAME[stageOf(p.fed) - 1]}</small></label>`).join('')}</div></div>`;
    }).join('') || '<div class="dim">還沒有生物。</div>'}</section>`;
}
function tank(D) {
  if (UI.tankEdit) return tankEditor(D);
  const n = CREATURES.filter(c => pets(c.id).some(p => inTank(p.id))).length;
  return `<section class="px">${sh('水族箱', 'AQUARIUM', `<span class="dim">${n} 種生物</span><button class="ghost" data-act="tankedit">設定</button>`)}
    <canvas id="tank" class="tank"></canvas>
    <div class="row" style="margin-top:8px"><span class="dim" id="feedInfo">${tankFeedText()}</span><span class="sp"></span>
      <button data-act="buyfeed">買飼料 ${FEED.pack} 顆・${FEED.price}${COIN}</button></div>
    <div class="mini">點水面撒飼料，吃到的那一隻會長大（幼體 → 成體 → 閃耀）。點生物可以看名字和型態。</div></section>`;
}
function tankStart() {
  cancelAnimationFrame(TANK.raf);
  const cv = document.getElementById('tank'); if (!cv) return;
  const W = Math.max(240, Math.floor(cv.clientWidth / 2)), H = Math.floor(cv.clientHeight / 2);   // 以 2 倍像素畫，維持像素感
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d'); x.imageSmoothingEnabled = false;
  const floorY = H - 16;
  const prev = new Map((TANK.fish || []).map(f => [f.key, f]));   // 重畫（例如買飼料）時，每一隻留在原位
  TANK.food = TANK.food || []; TANK.tip = null; TANK.bub = TANK.bub || [];
  // 外觀和體型跟著型態走：物種大小 × 自訂大小 × 型態大小
  const look = f => {
    const st = stageOf(fedOf(f.key));
    f.st = st; f.s = stageCanvas(f.c, st);
    const sc = TANK_SPECIES[f.c.id][0] * tankSize(f.c.id) * STAGE_SCALE[st - 1];
    f.w = Math.round(f.s.width * sc); f.h = Math.round(f.s.height * sc);
  };
  TANK.fish = [];
  for (const c of CREATURES) {
    const P = pets(c.id), [, speed, ground] = TANK_SPECIES[c.id];
    P.forEach((p, i) => {
      if (!inTank(p.id)) return;
      const f = { c, key: p.id, no: i + 1, many: P.length > 1, ground: !!ground, ph: Math.random() * 6, rest: 0,
        vx: speed * (.8 + Math.random() * .4) * (Math.random() < .5 ? -1 : 1) };
      look(f);
      const q = prev.get(f.key);
      if (q) { f.vx = q.vx; f.ph = q.ph; f.rest = q.rest; f.x = Math.min(q.x, Math.max(0, W - f.w)); f.baseY = ground ? floorY - f.h + 2 : Math.min(q.baseY, floorY - f.h + 2); f.y = ground ? f.baseY : q.y; }
      else { f.x = Math.random() * Math.max(1, W - f.w); f.y = f.baseY = ground ? floorY - f.h + 2 : 6 + Math.random() * Math.max(1, floorY - f.h - 24); }
      TANK.fish.push(f);
    });
  }
  TANK.fish.sort((a, b) => b.w * b.h - a.w * a.h);   // 大的畫在後面，小的在前面
  const weeds = Array.from({ length: Math.max(3, Math.floor(W / 60)) }, (_, i) => ({ x: 12 + i * (W - 24) / Math.max(1, Math.floor(W / 60) - 1), h: 18 + (i * 7) % 20 }));
  const tipFor = f => `${f.c.name}${f.many ? ` ${f.no} 號` : ''}・${STAGE_NAME[f.st - 1]}・吃了 ${fedOf(f.key)} 顆`;
  cv.onclick = e => {
    const r = cv.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width, py = (e.clientY - r.top) * H / r.height;
    const hit = [...TANK.fish].reverse().find(f => px >= f.x && px <= f.x + f.w && py >= f.y && py <= f.y + f.h);
    if (hit) { TANK.tip = { f: hit, until: performance.now() + 2200 }; SFX.tap(); return; }
    if (py >= floorY - 4) return;
    if (!useFeed()) { toast('飼料用完了，明天會再送 3 顆，也可以用金幣買'); return; }
    TANK.food.push({ x: px, y: py, vy: .25 }); ac(); SFX.tap();
    const el = document.getElementById('feedInfo'); if (el) el.textContent = tankFeedText();
  };
  let last = performance.now();
  const frame = now => {
    if (!document.body.contains(cv)) return;
    const dt = Math.min(3, (now - last) / 16.7); last = now;
    // 背景：一層層的海水、沙地、海草
    const bands = ['#1d5a8c', '#174c7a', '#123f68', '#0e3356', '#0b2846'];
    bands.forEach((c, i) => { x.fillStyle = c; x.fillRect(0, Math.floor(i * floorY / bands.length), W, Math.ceil(floorY / bands.length) + 1); });
    x.fillStyle = '#c2a36b'; x.fillRect(0, floorY, W, H - floorY);
    x.fillStyle = '#a3864f'; for (let i = 0; i < W; i += 7) x.fillRect(i, floorY + 3 + (i % 3), 2, 2);
    weeds.forEach((w, i) => { for (let j = 0; j < w.h; j += 3) { const sway = Math.round(Math.sin(now / 700 + i + j / 6) * 2); x.fillStyle = j % 6 ? '#38b764' : '#257179'; x.fillRect(w.x + sway, floorY - j, 3, 3); } });
    if (Math.random() < .03 * dt) TANK.bub.push({ x: Math.random() * W, y: floorY, s: 1 + Math.round(Math.random()) });
    TANK.bub = TANK.bub.filter(b => (b.y -= .5 * dt) > 0);
    x.fillStyle = 'rgba(180,240,255,.55)'; TANK.bub.forEach(b => x.fillRect(Math.round(b.x), Math.round(b.y), b.s, b.s));
    TANK.food.forEach(f => { if (f.y < floorY - 2) f.y += f.vy * dt; f.age = (f.age || 0) + dt; });
    TANK.food = TANK.food.filter(f => f.age < 1800);
    x.fillStyle = '#ef7d57'; TANK.food.forEach(f => x.fillRect(Math.round(f.x), Math.round(f.y), 2, 2));
    // 生物：飼料碰到身體就算吃到；吃到的那一隻會長大
    const eats = (f, p) => p.x >= f.x - 2 && p.x <= f.x + f.w + 2 && p.y >= f.y - 2 && p.y <= f.y + f.h + 2;
    for (const f of TANK.fish) {
      const sp0 = Math.abs(f.vx);
      let food = null, best = 1e9;
      for (const p of TANK.food) {
        if (f.ground && p.y < floorY - 3) continue;   // 海底生物只吃掉到地上的
        const dd = Math.hypot(p.x - (f.x + f.w / 2), p.y - (f.y + f.h / 2)); if (dd < best) { best = dd; food = p; }
      }
      if (food) {
        const dx = food.x - (f.x + f.w / 2), sp = Math.max(.12, sp0 * 1.8) * dt;   // 看到飼料會加速，但慢的還是慢
        f.x += Math.sign(dx) * Math.min(Math.abs(dx), sp);
        if (Math.abs(dx) > .5) f.vx = Math.sign(dx) * sp0;
        if (!f.ground) { const dy = food.y - (f.y + f.h / 2); f.baseY += Math.sign(dy) * Math.min(Math.abs(dy), sp * .8); }
        if (eats(f, food)) {
          TANK.food.splice(TANK.food.indexOf(food), 1); SFX.eat();
          const before = stageOf(fedOf(f.key));
          S.fed = S.fed || {}; S.fed[f.key] = fedOf(f.key) + 1;
          const after = stageOf(fedOf(f.key));
          if (after > before) {
            S.seen = S.seen || {}; S.seen[f.c.id] = Math.max(S.seen[f.c.id] || 1, after);
            const cx = f.x + f.w / 2, by = f.y + f.h; look(f); f.x = cx - f.w / 2; if (f.ground) f.y = floorY - f.h + 2; else f.baseY = by - f.h;
            SFX.rank(); toast(`${f.c.name}${f.many ? ` ${f.no} 號` : ''}長成${STAGE_NAME[after - 1]}了！`);
          }
          save();
        }
      } else if (f.ground) {
        if (f.rest > 0) f.rest -= dt; else { f.x += f.vx * dt; if (Math.random() < .004 * dt) f.rest = 60 + Math.random() * 180; }
      } else f.x += f.vx * dt;
      if (!f.ground) {
        f.baseY = Math.max(2, Math.min(floorY - f.h + 2, f.baseY));
        f.y = f.baseY + Math.sin(now / (f.c.id === 'jelly' ? 1600 : 900) + f.ph) * (f.c.id === 'jelly' ? 8 : 3);
      }
      if (f.x < 0) { f.x = 0; f.vx = Math.abs(f.vx); } else if (f.x > W - f.w) { f.x = W - f.w; f.vx = -Math.abs(f.vx); }
      x.save();
      if (f.vx < 0) { x.translate(Math.round(f.x) + f.w, Math.round(f.y)); x.scale(-1, 1); x.drawImage(f.s, 0, 0, f.w, f.h); }
      else x.drawImage(f.s, Math.round(f.x), Math.round(f.y), f.w, f.h);
      x.restore();
    }
    if (!TANK.fish.length) { x.fillStyle = '#eaf2ff'; x.font = '10px monospace'; x.textAlign = 'center'; x.fillText('水族箱是空的', W / 2, H / 2); }
    if (TANK.tip && now < TANK.tip.until && TANK.fish.includes(TANK.tip.f)) {
      const f = TANK.tip.f, text = tipFor(f);
      x.font = '10px "Microsoft JhengHei",monospace'; const tw = x.measureText(text).width + 8;
      const tx = Math.max(2, Math.min(W - tw - 2, f.x + f.w / 2 - tw / 2)), ty = Math.max(2, f.y - 16);
      x.fillStyle = '#0d2442'; x.fillRect(tx, ty, tw, 13); x.fillStyle = '#ffcd75'; x.textAlign = 'left'; x.fillText(text, tx + 4, ty + 10);
    }
    TANK.raf = requestAnimationFrame(frame);
  };
  TANK.raf = requestAnimationFrame(frame);
}

// 商店項目由使用者自己設定，存在 S.shop；沒設定過就用 CONFIG.shop 當預設
const shopItems = () => (S.shop || CONFIG.shop).filter(x => String(x.name || '').trim())

function finishShop() {

function log(D) {
  const lv = levelOf(D.xp), ri = rankIdx(lv), nxt = RANKS[ri + 1], lo = xpFor(lv), hi = xpFor(lv + 1);
  const td = dayKey(), H = activeHabits();
  // 「有打卡的日子」＝至少完成一個習慣；算出目前連續、最長連續、總天數
  const active = k => H.some(h => (D.days[k] || {})[h.id]);
  const allDays = Object.keys(D.days).filter(k => k <= td && active(k)).sort();
  let curRun = 0; for (let k = active(td) ? td : addDays(td, -1); active(k); k = addDays(k, -1)) curRun++;
  let best = 0, run = 0, prevDay = null;
  for (const k of allDays) { run = prevDay && addDays(prevDay, 1) === k ? run + 1 : 1; best = Math.max(best, run); prevDay = k; }
  // 月曆：一列一週，從第一次使用那週開始，最多顯示最近 12 週；顏色越亮代表當天完成越多習慣
  let start = weekKey(allDays[0] || td); const limit = addDays(weekKey(td), -7 * 11); if (start < limit) start = limit;
  let cells = '<span></span>' + ['一', '二', '三', '四', '五', '六', '日'].map(w => `<span class="wd">${w}</span>`).join('');
  for (let k = start; k <= addDays(weekKey(td), 6); k = addDays(k, 1)) {
    if (k === weekKey(k)) cells += `<span class="wk">${+k.slice(5, 7)}/${+k.slice(8)}</span>`;
    if (k > td) { cells += '<i class="blank"></i>'; continue; }
    const x = D.days[k] || {}, done = H.filter(h => x[h.id]), n = done.length;
    const l = n === 0 ? 0 : n >= H.length ? 4 : Math.min(3, Math.ceil(n / H.length * 3));
    cells += `<i class="l${l}${k === td ? ' today' : ''}" title="${k}　${esc(done.map(h => h.e + ' ' + h.n).join(' ')) || '—'}"></i>`;
  }
  const daysOf = k => Object.values(D.days).filter(x => x[k]).length;
  const rec = recentEntries();
  const runs = rec.filter(r => r.id === 'exercise' && r.e.type === '跑步' && r.e.dist > 0), runKm = runs.reduce((a, r) => a + +r.e.dist, 0);
  const pomos = S.logs.filter(l => l.k === 'pomo'), pomoHours = pomos.reduce((a, l) => a + (l.min || CONFIG.pomodoroMin), 0) / 60;
  return `<section class="px">${sh('等級', 'LEVEL')}
    <div class="row"><div class="big-lv"><span>Lv.</span>${lv}</div><div><b>${RANKS[ri][1]}</b><div class="mini" style="margin:0">共 ${D.xp} XP</div></div></div>
    <div class="bar"><i style="width:${Math.max(0, Math.min(100, (D.xp - lo) / (hi - lo) * 100))}%"></i></div>
    <div class="mini">升到 Lv.${lv + 1} 還差 ${hi - D.xp} XP${nxt ? `・Lv.${nxt[0]} 成為「${nxt[1]}」` : ''}</div></section>
  <section class="px">${sh('打卡紀錄', 'ACTIVITY')}
    <div class="streakbox"><div><small>目前連續</small><b>${curRun}</b><small>天</small></div>
      <div><small>最長連續</small><b>${best}</b><small>天</small></div><div><small>總共打卡</small><b>${allDays.length}</b><small>天</small></div></div>
    <div class="cal">${cells}</div>
    <small class="legend">少 <i style="background:#0f2a4d"></i><i style="background:#1f5a8a"></i><i style="background:#2f8fc0"></i><i style="background:#73eff7"></i><i style="background:#e8ffff"></i> 多</small></section>
  <section class="px">${sh('最近紀錄', 'RECENT')}
    ${rec.length ? rec.slice(0, 12).map(r => `<div class="entry"><span class="dim" style="flex:none">${r.d.slice(5).replace('-', '/')}</span><span class="sp">${esc(entryText(r))}</span></div>`).join('')
      : '<div class="dim">點「今日」的習慣卡片打卡，就會記在這裡。</div>'}</section>
  <section class="px">${sh('累積', 'TOTALS')}<div class="stat">
    ${H.map(h => h.kind === 'vocus' ? `<div><small>${esc(h.e)} ${esc(h.n)}</small><b>${D.articles}</b><small>篇文章</small></div>`
      : `<div><small>${esc(h.e)} ${esc(h.n)}</small><b>${daysOf(h.id)}</b><small>天</small></div>`).join('')}
    <div><small>番茄鐘</small><b>${pomos.length}</b><small>段・${pomoHours.toFixed(1)} 小時</small></div>
    <div><small>跑步總距離</small><b>${runKm.toFixed(1)}</b><small>km・${runs.length} 次</small></div>
    <div><small>潛水</small><b>${rec.filter(r => r.id === 'exercise' && r.e.type === '潛水').length}</b><small>支</small></div>
  </div></section>
  <section class="px">${sh('設定與備份', 'SETTINGS')}
    <label class="switch"><button class="toggle ${S.mute ? '' : 'on'}" data-act="mute" role="switch" aria-checked="${!S.mute}" aria-label="音效"><i></i></button><span>音效</span></label>
    <div class="mini" style="margin-top:12px">紀錄只存在這個瀏覽器。換手機、換瀏覽器或清除瀏覽資料就會消失，請定期備份。</div>
    <div class="row" style="margin-top:6px"><button data-act="export">備份</button><button data-act="import">還原</button></div></section>`;
}

function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 2600);
}
async function exportBackup() {
  const name = `習慣深潛-備份-${dayKey()}.json`, json = JSON.stringify(S, null, 1);
  const file = new File([json], name, { type: 'application/json' });
  // 手機優先用分享選單（可存到檔案、雲端硬碟）；不支援時改用下載
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: '習慣深潛備份' }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast(IN_APP ? '如果沒有下載，請改用 Chrome 或 Safari 開啟再備份' : '備份檔已下載');
}
function sheetDay() { return addDays(dayKey(), UI.sheet.day); }
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const v = b.dataset.v;
  switch (b.dataset.act) {
    case 'tab': if (UI.shopEdit) finishShop(); if (UI.habEdit) finishHabits(); UI.tankEdit = false; UI.tab = v; render(); window.scrollTo(0, 0); break;
    case 'pday': UI.pday = +v; render(); break;
    case 'iabok': UI.iabOk = true; render(); break;
    case 'start': startTimer(); break;
    case 'skipbreak': {
      const T = S.timer;
      if (T && T.segs[T.si].m === 'break') { T.start = Date.now() - T.segs[T.si].min * 60e3; tick(); }
      break;
    }
    case 'pomoset': S.pomoMin = +v; save(); render(); break;
    case 'cancel':
      if (await ask('結束這段工作階段？\n目前這段專注不會有獎勵，已完成的段落會保留。', '結束', '繼續')) { S.timer = null; save(); render(); tick(); }
      break;
    case 'askyes': ask.res && ask.res(true); break;
    case 'askno': ask.res && ask.res(false); break;
    case 'habtap':
      UI.sheet = { id: v, day: 0 }; renderSheet(); break;
    case 'shday': UI.sheet.day = +v; renderSheet(); break;
    case 'sheetclose': UI.sheet = null; renderSheet(); break;
    case 'chk': {
      const d = sheetDay(), id = UI.sheet.id;
      if (dayChecks(d, id).length) { while (dayChecks(d, id).length) delCheck(d, id, 0); }
      else { addCheck(d, id, {}); ac(); SFX.tap(); }

    }
    case 'exadd': {

    case 'habedit': UI.habEdit = true; render(); break;
    case 'habdone': finishHabits(); render(); toast('習慣已更新'); break;
    case 'habadd':
      if (customCount() >= CONFIG.maxCustom) break;

    case 'fact': UI.sheet = { creature: v }; renderSheet(); break;
    case 'pdone': {
      const d = viewDay(), it = getPlan(d)[v], c = catOf(it.cat);
      if (UI.pday > 0) break;
      if (!it.text.trim()) { toast('先寫下這件事'); render(); break; }
      it.done = !it.done;
      if (it.done) ac();
      // 只有「今天」打勾才開寶箱，每一格一天只抽一次；勾錯取消時獎勵先收進 it.held，再勾回來原封不動還回去
      reward(() => {
        if (UI.pday !== 0) { if (it.done) SFX.tap(); return; }
        if (!it.done) {
          let i = S.logs.findIndex(l => it.lid && l.id === it.lid);
          if (i < 0 && it.rw) {
            const linked = new Set(Object.values(S.plans).flat().map(x => x.lid).filter(Boolean));
            for (let j = S.logs.length - 1; j >= 0; j--) {
              const l = S.logs[j];
              if (l.k === 'check' && l.d === d && l.tag === c.n && !linked.has(l.id)) { i = j; break; }
            }
          }
          if (i >= 0) { it.lid = S.logs[i].id; it.held = S.logs.splice(i, 1)[0]; toast('已取消，這一項的獎勵先收回（再勾回來會還你）'); }
          return;
        }
        if (it.held) { S.logs.push(it.held); delete it.held; SFX.tap(); toast('已恢復這一項的獎勵'); return; }
        if (it.rw || +v >= CONFIG.rewardRows) { SFX.tap(); return; }
        it.rw = true;
        it.lid = grant('check', c.n, { title: `✔ ${it.text}`, xp: CONFIG.xp.check }).id;
      }, UI.pday === 0);
      break;
    }
    case 'plansave': {
      const d = viewDay();
      if (!filled(getPlan(d)).length) { toast('至少寫下一件重要的事'); break; }
      ac(); reward(() => grant('plan', null, { key: 'plan:' + d, d, title: '今天的清單寫好了！' })); break;
    }
    case 'redeem': {
      const it = shopItems().find(x => x.id === v);
      if (derive().coins < it.price || !(await ask(`用 ${it.price} 金幣兌換「${it.name}」？`, '兌換'))) break;
      S.logs.push({ id: rid(), t: Date.now(), d: dayKey(), k: 'redeem', name: it.name, c: -it.price });

    }
    case 'export': exportBackup(); break;
    case 'tankedit': UI.tankEdit = true; render(); break;
    case 'intank': S.outTank = S.outTank || {}; if (b.checked) delete S.outTank[v]; else S.outTank[v] = true; save(); break;
    case 'release': {
      const lg = S.logs.find(l => l.id === v), c = lg && CR[lg.drop]; if (!c) break;
      const no = pets(c.id).findIndex(p => p.id === v) + 1;
      if (!(await ask(`放生${c.name}${pets(c.id).length > 1 ? ` ${no} 號` : ''}？\n牠會回到大海，不會再出現在水族箱。圖鑑的收集紀錄會保留。`, '放生'))) break;
      S.released = S.released || {}; S.released[v] = true; save(); render(); renderSheet(); toast(`${c.name}回到大海了`); break;
    }
    case 'releasepick': {
      const lg = S.logs.find(l => l.id === v);
      S.released = S.released || {}; S.released[v] = true; save();
      UI.opened = false; render(); nextChest(); toast(`${CR[lg.drop].name}回到大海了`); break;
    }
    case 'fav': {
      const it = getPlan(viewDay())[v], t = it.text.trim();
      if (!t) { toast('先寫下內容，再存成常用'); break; }
      S.favs = S.favs || [];
      if (S.favs.includes(t)) S.favs = S.favs.filter(x => x !== t);
      else { if (S.favs.length >= 12) { toast('常用最多 12 個'); break; } S.favs.push(t); toast('已存成常用'); }
      save(); render(); break;
    }
    case 'usefav': {
      const P = getPlan(viewDay()), t = S.favs[+v], slot = P.find(x => !x.text.trim());
      if (P.some(x => x.text.trim() === t)) { toast('這件已經在清單裡了'); break; }
      if (!slot) { toast('六格都寫滿了'); break; }
      slot.text = t; save(); render(); break;
    }
    case 'delfav': S.favs.splice(+v, 1); save(); render(); break;
    case 'tankdone': UI.tankEdit = false; render(); toast('水族箱已更新'); break;
    case 'buyfeed': {
      if (derive().coins < FEED.price) { toast(`金幣不夠，飼料要 ${FEED.price} 金幣`); break; }
      S.logs.push({ id: rid(), t: Date.now(), d: dayKey(), k: 'redeem', name: `飼料 ${FEED.pack} 顆`, c: -FEED.price });
      S.feed = (S.feed || 0) + FEED.pack; save(); SFX.buy(); toast(`買了 ${FEED.pack} 顆飼料`);
      if (UI.tab === 'tank') { renderStat(); const el = document.getElementById('feedInfo'); if (el) el.textContent = tankFeedText(); }
      else render();
      break;
    }
    case 'import': document.getElementById('importFile').click(); break;
  }
});
// 點彈窗外面的暗色區域就關閉面板
document.getElementById('sheetov').addEventListener('click', e => { if (e.target.id === 'sheetov') { UI.sheet = null; renderSheet(); } });
document.addEventListener('keydown', e => {
  if (!document.getElementById('askov').classList.contains('hidden') && ask.res) {
    if (e.key === 'Enter') { e.preventDefault(); ask.res(true); }
    if (e.key === 'Escape') { e.preventDefault(); ask.res(false); }
  } else if (e.key === 'Escape' && UI.sheet) { UI.sheet = null; renderSheet(); }
});
// 輸入框只存資料不重畫，避免打字時失去焦點
document.addEventListener('input', e => {
  const el = e.target, i = el.dataset.i;
  if (el.id === 'pomoMin') {
    const m = Math.round(+el.value);
    if (m >= 5 && m <= 120) {
      S.pomoMin = m; save();
      const p = document.getElementById('pomoPlan');
      if (p) p.innerHTML = sessionPlan(m).map(x => `<span>${x.m === 'break' ? '休息' : '專注'} ${x.min}</span>`).join('<span>›</span>');
    }
    return;
  }
  if (el.id === 'exType') { UI.sheet.exType = el.value; renderSheet(); return; }
  if (el.id && el.id.startsWith('ex_')) {
    const g = k => { const i = document.getElementById('ex_' + k); return i ? +i.value : 0; };
    const p = document.getElementById('exPace');
    if (p) p.textContent = paceText({ type: document.getElementById('exType').value, dist: g('dist'), m: g('m'), min: g('min') });
    return;
  }
  if (el.dataset.sf) { S.shop[el.dataset.si][el.dataset.sf] = el.dataset.sf === 'price' ? +el.value : el.value; save(); return; }
  if (el.dataset.tf) {
    S.tankCfg = S.tankCfg || {};
    (S.tankCfg[el.dataset.tv] || (S.tankCfg[el.dataset.tv] = {})).size = +el.value; save(); return;
  }
  if (el.dataset.gf) { S.gcats[el.dataset.gi][el.dataset.gf] = el.value; save(); return; }
  if (el.dataset.hf) {
    const h = S.habits[el.dataset.hi], f = el.dataset.hf;
    h[f] = f === 'weeks' || f === 'target' ? +el.value : el.value;
    save(); if (f === 'weeks') render();
    return;
  }
  if (i === undefined || !el.dataset.pf) return;
  const it = getPlan(viewDay())[i];
  it[el.dataset.pf] = el.value;
  if (el.dataset.pf === 'cat') render();
  save();
});
document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (!Array.isArray(j.logs)) throw 0;
    if (await ask(`備份檔有 ${j.logs.length} 筆紀錄，目前有 ${S.logs.length} 筆。\n確定用備份取代目前資料？`, '還原')) {
      S = migrate(Object.assign(blank(), j)); save(); render(); toast('已還原');
    }
  } catch (err) { toast('這不是有效的備份檔'); }
});

/* ========= 啟動 ========= */
(function init() {
  document.getElementById('logo').innerHTML = img(CR.clown.px, 3);
  const bub = document.getElementById('bubbles');
  for (let i = 0; i < 10; i++) {
    const s = 3 + (i % 3) * 2;
    bub.insertAdjacentHTML('beforeend', `<i style="left:${(i * 37 + 7) % 100}%;width:${s}px;height:${s}px;animation-duration:${9 + (i * 7) % 11}s;animation-delay:-${(i * 3) % 13}s"></i>`);
  }
  render(); tick();
  setInterval(tick, 500);
  if (!derive().claimed.has('welcome')) { grant('welcome', null, { key: 'welcome' }); save(); render(); nextChest(); }
  // 跨過換日時間時重新整理畫面
  let lastDay = dayKey();
  setInterval(() => { if (dayKey() !== lastDay) { lastDay = dayKey(); render(); } }, 30e3);
})();
</script>
</body>
